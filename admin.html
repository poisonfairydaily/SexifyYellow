<script>
        async function handleUpload() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const fileInput = document.getElementById('p-file');
            const status = document.getElementById('status');
            const btn = document.getElementById('upload-btn');

            if (!name || !price || !fileInput.files[0]) return alert("請填寫完整資訊");

            btn.disabled = true;
            status.innerText = "正在檢查登入狀態...";

            try {
                // 🔐 1. 取得使用者的登入門票 (Token)
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (!session) {
                    throw new Error("您尚未登入，請先登入後再上傳商品！");
                }
                const token = session.access_token;

                status.innerText = "正在處理相片上傳...";

                const file = fileInput.files[0];
                // 產生唯一檔名，避免重複覆蓋 (時間戳 + 原始檔名)
                const fileName = `${Date.now()}-${file.name}`;
                // 注意：這裡請確保網址是你自己的 Worker 網址
                const workerUrl = `https://sexifyyellow.poisonfairydaily.workers.dev/?key=${encodeURIComponent(fileName)}`;

                // 📤 2. 上傳相片到 Cloudflare R2，並【帶上門票】
                const uploadRes = await fetch(workerUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}` // 就是這行！向 Worker 出示門票
                    },
                    body: file
                });

                if (!uploadRes.ok) {
                    const errorText = await uploadRes.text();
                    throw new Error(`相片上傳 R2 失敗: ${errorText}`);
                }

                status.innerText = "相片上傳成功，正在寫入資料庫...";

                // 💾 3. 將資訊寫入 Supabase 資料庫
                const { error } = await window.supabaseClient.from('products').insert([
                    { 
                        name: name, 
                        price: parseInt(price), 
                        description: desc, 
                        image_url: fileName // 只存檔名
                    }
                ]);

                if (error) throw error;

                status.innerText = "🎉 商品發佈成功！";
                setTimeout(() => location.reload(), 2000);

            } catch (err) {
                console.error(err);
                status.innerText = "錯誤: " + err.message;
                btn.disabled = false;
            }
        }
    </script>
