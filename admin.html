<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFY 管理員中控台</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --sexify: #ff2442; }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #admin-dashboard, #login-section { display: none; }
        .preview-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid #eee; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 2px solid var(--sexify); color: var(--sexify); font-weight: 900; }
    </style>
</head>
<body class="min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 rounded-[2rem] shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black italic tracking-tighter text-gray-900 mb-1">SFY ADMIN</h1>
                <p class="text-gray-400 text-sm font-bold">最高權限管理中心</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="login-email" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="管理員信箱">
                <input type="password" id="login-password" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="密碼">
                <button id="login-btn" class="w-full bg-black text-white font-black py-4 rounded-2xl hover:opacity-90 transition-all active:scale-95 shadow-lg">進入系統</button>
                <p id="login-status" class="text-red-500 text-xs text-center mt-2 font-bold"></p>
            </div>
        </div>
    </div>

    <div id="admin-dashboard" class="flex flex-col min-h-screen">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black italic tracking-tighter text-red-500">SFY ADMIN</h1>
                <span class="bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded">官方後台</span>
            </div>
            <button id="logout-btn-trigger" class="text-gray-500 hover:text-black font-bold text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 登出
            </button>
        </header>

        <div class="bg-white px-6 border-b border-gray-200 flex gap-8 overflow-x-auto">
            <button onclick="switchTab('tab-upload')" class="tab-btn active pb-4 pt-5 whitespace-nowrap text-gray-500 font-bold text-sm transition">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i>發布官方商品
            </button>
            <button onclick="switchTab('tab-products')" class="tab-btn pb-4 pt-5 whitespace-nowrap text-gray-500 font-bold text-sm transition">
                <i class="fa-solid fa-store mr-2"></i>商戶上架申請
            </button>
            <button onclick="switchTab('tab-audit')" class="tab-btn pb-4 pt-5 whitespace-nowrap text-gray-500 font-bold text-sm transition">
                <i class="fa-solid fa-shield-halved mr-2"></i>活躍商品監控 (Dashboard)
            </button>
            <button onclick="switchTab('tab-posts')" class="tab-btn pb-4 pt-5 whitespace-nowrap text-gray-500 font-bold text-sm transition">
                <i class="fa-solid fa-users mr-2"></i>用戶動態審核
            </button>
        </div>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            
            <div id="tab-upload" class="tab-content active max-w-xl mx-auto bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100 mt-6">
                <h2 class="text-xl font-black text-gray-900 mb-6"><i class="fa-solid fa-award text-yellow-500 mr-2"></i>上架官方精選商品</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">作品名稱</label>
                        <input type="text" id="p-name" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="輸入標題">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">定價 (🪙)</label>
                        <input type="number" id="p-price" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">商品描述</label>
                        <textarea id="p-desc" rows="3" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="輸入商品詳細描述..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">上傳相片 (將自動進行 AI 安全掃描與 WebP 轉換)</label>
                        <input type="file" id="p-image" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-red-50 file:text-red-600 hover:file:bg-red-100 cursor-pointer" accept="image/*" multiple>
                    </div>
                    <div id="preview-container" class="grid grid-cols-4 gap-2 mt-2 max-h-40 overflow-y-auto custom-scroll"></div>
                    <button id="upload-btn" class="w-full bg-red-500 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition">確認並發布</button>
                    <p id="status" class="text-center text-xs text-gray-500 font-bold mt-2"></p>
                </div>
            </div>

            <div id="tab-products" class="tab-content">
                <div class="flex justify-between items-center mb-6 mt-2">
                    <h2 class="text-xl font-black text-gray-900">商戶上架申請 (待審核)</h2>
                    <button onclick="loadPendingProducts()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right mr-2"></i>重新整理</button>
                </div>
                <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full text-center py-20 text-gray-400 font-bold">載入中...</div>
                </div>
            </div>

            <div id="tab-audit" class="tab-content">
                <div class="flex justify-between items-center mb-6 mt-2">
                    <h2 class="text-xl font-black text-gray-900">活躍商品監控與 AI 報告</h2>
                    <button onclick="loadAuditList()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right mr-2"></i>重新整理</button>
                </div>
                <div class="bg-white rounded-[2rem] border border-gray-100 shadow-sm overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th class="p-4 text-xs font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">預覽圖</th>
                                <th class="p-4 text-xs font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">商品資訊</th>
                                <th class="p-4 text-xs font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">價格</th>
                                <th class="p-4 text-xs font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">AI 報告</th>
                                <th class="p-4 text-xs font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">管理操作</th>
                            </tr>
                        </thead>
                        <tbody id="audit-list" class="divide-y divide-gray-100 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="tab-posts" class="tab-content">
                <div class="flex justify-between items-center mb-6 mt-2">
                    <h2 class="text-xl font-black text-gray-900">用戶日常動態 (Posts)</h2>
                    <button onclick="loadRecentPosts()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right mr-2"></i>重新整理</button>
                </div>
                <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full text-center py-20 text-gray-400 font-bold">載入中...</div>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/upload-helper.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
