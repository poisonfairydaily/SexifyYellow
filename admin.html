<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商戶安全後台 - 方案 3 專業版</title>
    <style>
        :root { --primary: #000; --bg: #f5f5f7; --card: #fff; --sexify: #ff3b30; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; font-weight: 700; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #admin-section, #login-section { display: none; }
        #preview-container { position: relative; width: 100%; margin-top: 10px; display: none; }
        #preview { width: 100%; border-radius: 10px; object-fit: cover; max-height: 200px; }
        .blur-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: #white; font-size: 10px; padding: 4px 8px; border-radius: 5px; color: white; }
        .logout-btn { background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 10px; }
        #status { text-align: center; font-size: 13px; margin-top: 15px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section" class="card">
        <h2>商戶登入</h2>
        <input type="email" id="login-email" placeholder="管理員信箱">
        <input type="password" id="login-password" placeholder="密碼">
        <button id="login-btn">進入系統</button>
        <p id="login-status" style="color:red; font-size:12px; margin-top:10px; text-align:center;"></p>
    </div>

    <div id="admin-section" class="card">
        <h2>上架高清商品</h2>
        <label>商品名稱</label>
        <input type="text" id="p-name" placeholder="例如：私密寫真集 A">
        <label>解鎖價格 (🪙)</label>
        <input type="number" id="p-price" placeholder="例如：50">
        <label>上傳原圖 (系統將自動生成模糊預覽)</label>
        <input type="file" id="p-image" accept="image/*">
        
        <div id="preview-container">
            <span class="blur-badge">圖片已選取</span>
            <img id="preview" src="" alt="預覽">
        </div>

        <button id="upload-btn" style="margin-top:20px;">確認並自動上架</button>
        <button onclick="handleLogout()" class="logout-btn">登出系統</button>
        <p id="status"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoc212YmVlYnV4c2Nudm5tbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NDU5MTgsImV4cCI6MjA5MDQyMTkxOH0.kK5A0RYj6RrzBJHMleKcFQp4wVq7hCm-lVDTbnxrFJQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById('login-section');
    const adminSection = document.getElementById('admin-section');

    // 檢查管理員權限
    window.onload = async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('is_admin')
                .eq('id', session.user.id)
                .single();
            
            if (profile && profile.is_admin === true) {
                showAdmin();
            } else {
                alert("權限不足");
                await supabaseClient.auth.signOut();
                location.reload();
            }
        } else {
            showLogin();
        }
    };

    function showLogin() { loginSection.style.display = 'block'; }
    function showAdmin() { adminSection.style.display = 'block'; }

    // 登入邏輯
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('login-status').innerText = "登入失敗：" + error.message;
            btn.disabled = false;
        } else {
            location.reload();
        }
    });

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    // 選擇圖片預覽
    document.getElementById('p-image').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('preview').src = event.target.result;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    /**
     * 核心功能：Canvas 模糊化處理
     */
    async function generateBlurBlob(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 預覽圖縮小尺寸，增加效能並節省空間
                const max_size = 400;
                let width = img.width;
                let height = img.height;
                if (width > height) {
                    if (width > max_size) { height *= max_size / width; width = max_size; }
                } else {
                    if (height > max_size) { width *= max_size / height; height = max_size; }
                }

                canvas.width = width;
                canvas.height = height;

                // 套用高斯模糊
                ctx.filter = 'blur(25px)'; // 強力模糊
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.7);
            };
        });
    }

    // 上傳邏輯
    document.getElementById('upload-btn').addEventListener('click', async () => {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const file = document.getElementById('p-image').files[0];
        const status = document.getElementById('status');
        const btn = document.getElementById('upload-btn');

        if (!name || !price || !file) return alert("資訊不完整");

        btn.disabled = true;
        status.innerText = "⏳ 正在生成模糊預覽並同步上傳...";

        try {
            const fileName = `${Date.now()}.jpg`;

            // 1. 生成模糊 Blob
            const blurBlob = await generateBlurBlob(file);

            // 2. 上傳原圖到 products (Private)
            const { error: err1 } = await supabaseClient.storage
                .from('products')
                .upload(fileName, file);
            if (err1) throw err1;

            // 3. 上傳模糊圖到 previews (Public)
            const { error: err2 } = await supabaseClient.storage
                .from('previews')
                .upload(fileName, blurBlob);
            if (err2) throw err2;

            // 4. 寫入資料庫 (只存檔名)
            const { error: dbError } = await supabaseClient
                .from('products')
                .insert([{
                    name: name,
                    price: parseInt(price),
                    image_url: fileName,    // 存入 products 桶的檔名
                    preview_url: fileName   // 存入 previews 桶的檔名 (方案3)
                }]);

            if (dbError) throw dbError;

            alert("✅ 上架成功！原圖與預覽圖已分離存放。");
            location.reload();
        } catch (err) {
            console.error(err);
            status.innerText = "❌ 出錯：" + err.message;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
