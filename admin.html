<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商戶後台管理</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #000; color: white; cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #preview { width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
        #status { font-size: 14px; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>上架新商品</h2>
        <input type="text" id="p-name" placeholder="商品名稱">
        <input type="number" id="p-price" placeholder="價格">
        <input type="file" id="p-image" accept="image/*">
        <img id="preview" src="" alt="預覽圖">
        <button id="upload-btn">確認上架</button>
        <p id="status"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- 1. 設定區 (請務必填入你的正確資料) ---
        const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoc212YmVlYnV4c2Nudm5tbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NDU5MTgsImV4cCI6MjA5MDQyMTkxOH0.kK5A0RYj6RrzBJHMleKcFQp4wVq7hCm-lVDTbnxrFJQ';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const uploadBtn = document.getElementById('upload-btn');
        const statusText = document.getElementById('status');
        const fileInput = document.getElementById('p-image');
        const previewImg = document.getElementById('preview');

        // --- 2. 預覽圖片功能 ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 3. 核心上傳功能 ---
        uploadBtn.addEventListener('click', async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const file = fileInput.files[0];

            if (!name || !price || !file) {
                alert('請完整填寫名稱、價格並選擇圖片');
                return;
            }

            // 開始執行
            console.log("開始上傳流程...");
            uploadBtn.disabled = true;
            statusText.innerText = "處理中，請稍候...";

            try {
                // A. 上傳圖片到 Storage
                const fileName = `${Date.now()}_${file.name}`;
                const { data: storageData, error: storageError } = await supabase.storage
                    .from('products')
                    .upload(fileName, file);

                if (storageError) throw storageError;

                // B. 取得圖片公開網址 (或簽名網址)
                const { data: urlData } = supabase.storage.from('products').getPublicUrl(fileName);
                const imageUrl = urlData.publicUrl;

                // C. 將資料寫入 Database
                const { error: dbError } = await supabase
                    .from('products')
                    .insert([{ name, price: parseInt(price), image_url: imageUrl }]);

                if (dbError) throw dbError;

                alert('✅ 上架成功！');
                location.reload(); // 成功後刷新頁面

            } catch (err) {
                console.error("錯誤細節:", err);
                statusText.innerText = "錯誤: " + (err.message || "上傳失敗");
                uploadBtn.disabled = false;
            }
        });
        
        console.log("控制台已就緒，等待操作...");
    </script>
</body>
</html>
