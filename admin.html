<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>商品管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-lg">
        <h1 class="text-2xl font-black mb-6">發佈新產品</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">商品名稱</label>
                <input type="text" id="p-name" class="w-full border p-3 rounded-xl outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">價格 (金幣)</label>
                <input type="number" id="p-price" class="w-full border p-3 rounded-xl outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">描述</label>
                <textarea id="p-desc" class="w-full border p-3 rounded-xl outline-none"></textarea>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">上傳相片</label>
                <input type="file" id="p-file" accept="image/*" class="w-full">
            </div>
            
            <button onclick="handleUpload()" id="upload-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">
                確認發佈
            </button>
        </div>
        <p id="status" class="mt-4 text-sm text-center text-gray-500"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        async function handleUpload() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const fileInput = document.getElementById('p-file');
            const status = document.getElementById('status');
            const btn = document.getElementById('upload-btn');

            if (!name || !price || !fileInput.files[0]) return alert("請填寫完整資訊");

            btn.disabled = true;
            status.innerText = "正在處理中...";

            const file = fileInput.files[0];
            // 產生唯一檔名，避免重複覆蓋 (時間戳 + 原始檔名)
            const fileName = `${Date.now()}-${file.name}`;
            const workerUrl = `https://sexifyyellow.poisonfairydaily.workers.dev/?key=${encodeURIComponent(fileName)}`;

            try {
                // 1. 上傳相片到 Cloudflare R2 (透過 Worker)
                const uploadRes = await fetch(workerUrl, {
                    method: 'PUT',
                    body: file
                });

                if (!uploadRes.ok) throw new Error("相片上傳 R2 失敗");

                // 2. 將資訊寫入 Supabase 資料庫
                const { error } = await window.supabaseClient.from('products').insert([
                    { 
                        name: name, 
                        price: parseInt(price), 
                        description: desc, 
                        image_url: fileName // 只存檔名，shop.js 會自動拼接
                    }
                ]);

                if (error) throw error;

                status.innerText = "🎉 商品發佈成功！";
                setTimeout(() => location.reload(), 2000);

            } catch (err) {
                console.error(err);
                status.innerText = "錯誤: " + err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
