<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商戶安全後台 - 官方管理版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sexify: #ff3b30; }
        body { background-color: #f5f5f7; }
        /* 初始狀態全部隱藏，防止閃爍或權限外洩 */
        #admin-section, #login-section { display: none; }
        .preview-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid #eee; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md">
    <div id="login-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-gray-900">商戶登入</h2>
            <p class="text-gray-400 text-sm">請輸入管理員憑證以進入系統</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="login-email" class="w-full bg-gray-50 border-none rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-black outline-none transition-all" placeholder="管理員信箱">
            <input type="password" id="login-password" class="w-full bg-gray-50 border-none rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-black outline-none transition-all" placeholder="密碼">
            <button id="login-btn" class="w-full bg-black text-white font-bold py-4 rounded-2xl hover:opacity-90 transition-all">進入系統</button>
            <p id="login-status" class="text-red-500 text-xs text-center"></p>
        </div>
    </div>

    <div id="admin-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-gray-900">上架新商品</h2>
            <a href="dashboard.html" class="text-blue-500 text-xs font-bold hover:underline"><i class="fa-solid fa-chart-line mr-1"></i>審核中控台</a>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 ml-2">作品名稱</label>
                <input type="text" id="p-name" class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="輸入標題">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 ml-2">定價 (🪙)</label>
                <input type="number" id="p-price" class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="0.0">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 ml-2">上傳高清相片 (WebP)</label>
                <input type="file" id="p-image" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100" accept="image/*" multiple>
            </div>

            <div id="preview-container" class="grid grid-cols-3 gap-2 mt-2"></div>

            <button id="upload-btn" class="w-full bg-red-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-100 hover:bg-red-600 transition-all active:scale-95">確認並批量上架</button>
            <button id="logout-btn-trigger" class="w-full bg-white text-gray-400 font-bold py-3 rounded-2xl border border-gray-100 mt-2 text-xs hover:bg-gray-50">登出系統</button>
            <p id="status" class="text-center text-[11px] text-gray-400 mt-4 leading-relaxed"></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js"></script>
</body>
</html>
