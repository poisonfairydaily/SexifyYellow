<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商戶安全後台 - 多圖專業版</title>
    <style>
        :root { --primary: #000; --bg: #f5f5f7; --card: #fff; --sexify: #ff3b30; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; font-weight: 700; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #admin-section, #login-section { display: none; }
        
        /* 多圖預覽容器樣式 */
        #preview-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-top: 10px; 
            display: none; 
        }
        .preview-img { 
            width: 100%; 
            aspect-ratio: 1; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 1px solid #eee;
        }

        .logout-btn { background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 10px; }
        #status { text-align: center; font-size: 13px; margin-top: 15px; color: #888; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section" class="card">
        <h2>商戶登入</h2>
        <input type="email" id="login-email" placeholder="管理員信箱">
        <input type="password" id="login-password" placeholder="密碼">
        <button id="login-btn">進入系統</button>
        <p id="login-status" style="color:red; font-size:12px; margin-top:10px; text-align:center;"></p>
    </div>

    <div id="admin-section" class="card">
        <h2>上架高清商品 (多圖版)</h2>
        <label>商品名稱</label>
        <input type="text" id="p-name" placeholder="例如：私密相簿 - 夏日篇">
        <label>解鎖價格 (🪙)</label>
        <input type="number" id="p-price" placeholder="例如：99">
        <label>上傳圖片 (可多選，系統自動處理)</label>
        <input type="file" id="p-image" accept="image/*" multiple>
        
        <div id="preview-container">
            </div>

        <button id="upload-btn" style="margin-top:20px;">開始批量上傳</button>
        <button onclick="handleLogout()" class="logout-btn">登出系統</button>
        <p id="status"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoc212YmVlYnV4c2Nudm5tbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NDU5MTgsImV4cCI6MjA5MDQyMTkxOH0.kK5A0RYj6RrzBJHMleKcFQp4wVq7hCm-lVDTbnxrFJQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById('login-section');
    const adminSection = document.getElementById('admin-section');

    window.onload = async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', session.user.id).single();
            if (profile && profile.is_admin) { showAdmin(); } 
            else { alert("權限不足"); await supabaseClient.auth.signOut(); location.reload(); }
        } else { showLogin(); }
    };

    function showLogin() { loginSection.style.display = 'block'; }
    function showAdmin() { adminSection.style.display = 'block'; }

    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { document.getElementById('login-status').innerText = "失敗：" + error.message; btn.disabled = false; }
        else { location.reload(); }
    });

    async function handleLogout() { await supabaseClient.auth.signOut(); location.reload(); }

    // 多圖預覽處理
    document.getElementById('p-image').addEventListener('change', function(e) {
        const files = e.target.files;
        const container = document.getElementById('preview-container');
        container.innerHTML = '';
        if (files.length > 0) {
            container.style.display = 'grid';
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'preview-img';
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
    });

    // 模糊化函數 (Canvas)
    async function generateBlurBlob(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const max_size = 400;
                let width = img.width;
                let height = img.height;
                if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                canvas.width = width;
                canvas.height = height;
                ctx.filter = 'blur(25px)';
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.7);
            };
        });
    }

    // 核心上傳邏輯 (循環處理)
    document.getElementById('upload-btn').addEventListener('click', async () => {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const files = document.getElementById('p-image').files;
        const status = document.getElementById('status');
        const btn = document.getElementById('upload-btn');

        if (!name || !price || files.length === 0) return alert("請填寫完整資訊並選擇圖片");

        btn.disabled = true;
        let uploadedNames = [];

        try {
            // 逐一處理每一張圖
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                status.innerText = `⏳ 正在處理第 ${i + 1}/${files.length} 張圖片...`;

                // 生成檔名 (移除空格以防出錯)
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${i}.${fileExt}`;

                // 1. 生成模糊圖
                const blurBlob = await generateBlurBlob(file);

                // 2. 上傳原圖 (Private)
                const { error: err1 } = await supabaseClient.storage.from('products').upload(fileName, file);
                if (err1) throw err1;

                // 3. 上傳模糊圖 (Public)
                const { error: err2 } = await supabaseClient.storage.from('previews').upload(fileName, blurBlob);
                if (err2) throw err2;

                uploadedNames.push(fileName);
            }

            // 將所有檔名組合為 "1.jpg,2.jpg,3.jpg"
            const finalString = uploadedNames.join(',');

            // 4. 寫入資料庫
            status.innerText = "⏳ 正在寫入資料庫...";
            const { error: dbError } = await supabaseClient.from('products').insert([{
                name: name,
                price: parseInt(price),
                image_url: finalString,
                preview_url: finalString
            }]);

            if (dbError) throw dbError;

            alert(`✅ 成功！已上架 ${files.length} 張相片。`);
            location.reload();

        } catch (err) {
            console.error(err);
            status.innerText = "❌ 失敗：" + err.message;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
