<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商戶後台管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; padding: 20px; }
        .card { background: white; max-width: 450px; margin: 40px auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a1a1a; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #666; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: none; border-color: #000; }
        button { background: #000; color: white; cursor: pointer; font-weight: 600; border: none; transition: all 0.2s; margin-top: 20px; }
        button:hover { background: #333; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #preview { width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #eee; }
        #status { font-size: 14px; color: #888; text-align: center; margin-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>上架新商品</h2>
        
        <label>商品名稱</label>
        <input type="text" id="p-name" placeholder="例如：黃色蕾絲連身裙">
        
        <label>價格 (TWD)</label>
        <input type="number" id="p-price" placeholder="990">
        
        <label>商品圖片 (建議小於 500KB)</label>
        <input type="file" id="p-image" accept="image/*">
        <img id="preview" src="" alt="預覽圖">
        
        <button id="upload-btn">確認上架商品</button>
        <p id="status"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- 1. 設定區 ---
        const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoc212YmVlYnV4c2Nudm5tbHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NDU5MTgsImV4cCI6MjA5MDQyMTkxOH0.kK5A0RYj6RrzBJHMleKcFQp4wVq7hCm-lVDTbnxrFJQ';
        
        // 使用專屬變數名稱避免衝突
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const uploadBtn = document.getElementById('upload-btn');
        const statusText = document.getElementById('status');
        const fileInput = document.getElementById('p-image');
        const previewImg = document.getElementById('preview');

        // --- 2. 預覽圖片功能 ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 3. 核心上傳功能 ---
        uploadBtn.addEventListener('click', async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const file = fileInput.files[0];

            if (!name || !price || !file) {
                alert('請完整填寫名稱、價格並選擇圖片');
                return;
            }

            // 開始流程
            uploadBtn.disabled = true;
            statusText.style.color = "#888";
            statusText.innerText = "⏳ 正在處理中...";

            try {
                // Step A: 上傳圖片到 Storage
                statusText.innerText = "⏳ 正在上傳圖片至 Storage...";
                const fileName = `${Date.now()}_${file.name}`;
                const { data: storageData, error: storageError } = await supabaseClient.storage
                    .from('products')
                    .upload(fileName, file);

                if (storageError) throw new Error("圖片上傳失敗: " + storageError.message);

                // Step B: 取得圖片公開網址
                const { data: urlData } = supabaseClient.storage.from('products').getPublicUrl(fileName);
                const imageUrl = urlData.publicUrl;

                // Step C: 將資料寫入 Database
                statusText.innerText = "⏳ 圖片上傳成功，正在寫入資料庫...";
                const { error: dbError } = await supabaseClient
                    .from('products')
                    .insert([{ 
                        name: name, 
                        price: parseInt(price), 
                        image_url: imageUrl 
                    }]);

                if (dbError) throw new Error("資料庫寫入失敗: " + dbError.message);

                // 完成
                statusText.style.color = "green";
                statusText.innerText = "✅ 商品已成功上架！頁面即將重新整理...";
                
                setTimeout(() => {
                    location.reload();
                }, 1500);

            } catch (err) {
                console.error("Debug Detail:", err);
                statusText.style.color = "red";
                statusText.innerText = "❌ 發生錯誤：" + err.message;
                uploadBtn.disabled = false;
            }
        });
        
        console.log("後台系統初始化完成。");
    </script>
</body>
</html>
