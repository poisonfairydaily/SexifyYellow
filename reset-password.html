<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定新密碼 - 商城系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl w-full max-w-sm border border-gray-100">
        <h2 class="text-2xl font-black text-gray-900 mb-2">設定新密碼</h2>
        <p class="text-gray-400 text-xs mb-8">請輸入您的新密碼，建議至少 6 位數。</p>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase tracking-widest">New Password</label>
                <input type="password" id="new-password" placeholder="••••••••" 
                    class="w-full p-4 bg-gray-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-sexify transition-all">
            </div>

            <button onclick="handleUpdatePassword()" id="update-btn" 
                class="w-full bg-[#ff2442] text-white p-4 rounded-2xl font-bold text-sm hover:opacity-90 transition-all active:scale-95">
                確認修改密碼
            </button>

            <p id="message" class="text-center text-[11px] font-medium min-h-[1rem]"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
        const SUPABASE_ANON_KEY = '你的_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleUpdatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('update-btn');
            const msgLabel = document.getElementById('message');

            if (newPassword.length < 6) {
                msgLabel.style.color = "#ff4d4f";
                msgLabel.textContent = "❌ 密碼長度至少需 6 位";
                return;
            }

            btn.disabled = true;
            btn.innerText = "正在更新...";

            try {
                // ✨ Supabase 會在使用者點擊郵件連結回來時，自動處理 Session
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                msgLabel.style.color = "#52c41a";
                msgLabel.textContent = "🎉 密碼更新成功！即將跳轉...";
                
                // 成功後延遲 2 秒跳轉回首頁
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (err) {
                msgLabel.style.color = "#ff4d4f";
                msgLabel.textContent = "❌ " + err.message;
                btn.disabled = false;
                btn.innerText = "確認修改密碼";
            }
        }
    </script>
</body>
</html>
