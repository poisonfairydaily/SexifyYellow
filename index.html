<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white antialiased overflow-hidden">

    <div id="app" class="h-screen flex flex-col">
        <header class="p-4 flex justify-between items-center border-b border-gray-800">
            <h1 class="text-2xl font-bold text-pink-500">Sexify</h1>
            <div class="flex gap-4">
                <div id="shop-actions" class="hidden flex gap-2">
                    <button onclick="toggleCartModal()" class="relative p-2 bg-gray-800 rounded-full">
                        🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-pink-500 text-[10px] px-1 rounded-full">0</span>
                    </button>
                    <button onclick="toggleOrdersModal()" class="p-2 bg-gray-800 rounded-full">📋</button>
                </div>
                <button id="settings-btn" class="p-2">⚙️</button>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto pb-20">
            </main>

        <nav class="fixed bottom-0 w-full bg-black border-t border-gray-800 flex justify-around py-3">
            <button onclick="switchTab('discovery')" class="tab-item text-gray-400">發現</button>
            <button onclick="switchTab('shop')" class="tab-item text-gray-400">商店</button>
            <button onclick="switchTab('create')" class="tab-item text-gray-400">發佈</button>
            <button onclick="switchTab('messages')" class="tab-item text-gray-400">訊息</button>
            <button onclick="switchTab('profile')" class="tab-item text-gray-400">個人</button>
        </nav>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold">我的購物車</h2>
            <button onclick="toggleCartModal()" class="text-2xl">✕</button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-4">
            </div>
        <div class="p-4 border-t border-gray-800">
            <div class="flex justify-between mb-4 text-lg">
                <span>總計:</span>
                <span id="cart-total" class="text-pink-500 font-bold">0 金幣</span>
            </div>
            <button onclick="proceedToCheckout()" class="w-full bg-pink-500 py-3 rounded-xl font-bold">進入結算</button>
        </div>
    </div>

    <div id="orders-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold">訂單記錄</h2>
            <button onclick="toggleOrdersModal()" class="text-2xl">✕</button>
        </div>
        <div class="flex border-b border-gray-800">
            <button onclick="filterOrders('ongoing')" class="flex-1 py-3 border-b-2 border-pink-500" id="order-tab-ongoing">進行中</button>
            <button onclick="filterOrders('completed')" class="flex-1 py-3 text-gray-400" id="order-tab-completed">已完成</button>
        </div>
        <div id="orders-list" class="flex-1 overflow-y-auto p-4 space-y-4">
            </div>
    </div>

    <div id="group-manage-modal" class="fixed inset-0 bg-black/90 z-[70] hidden flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold">群組設定</h2>
            <button onclick="closeGroupManage()" class="text-2xl">✕</button>
        </div>
        <div class="p-4 space-y-6">
            <section>
                <h3 class="text-gray-400 mb-2">成員列表</h3>
                <div id="group-member-list" class="space-y-3">
                    </div>
            </section>
            <button onclick="inviteNewMember()" class="w-full bg-gray-800 py-3 rounded-lg text-pink-400">+ 邀請新成員</button>
            <button id="leave-group-btn" class="w-full bg-red-500/20 text-red-500 py-3 rounded-lg border border-red-500/50">退出群組</button>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/create.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
