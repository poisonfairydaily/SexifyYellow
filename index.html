<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200;
            display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[300] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-4 tracking-widest">SEXIFY</h1>
            <p class="text-gray-400 text-sm mb-8" data-i18n="age_desc">本網站包含成人內容，進入前請確認您已滿 18 歲</p>
            <button onclick="verifyAge()" class="bg-sexify text-white px-12 py-4 rounded-full font-bold text-lg active:scale-95 transition" data-i18n="age_btn">我已滿 18 歲，進入</button>
        </div>
    </div>

    <div id="search-overlay" class="search-overlay">
        <div class="p-4 flex items-center gap-3 border-b">
            <div class="flex-1 bg-gray-100 rounded-full flex items-center px-4 py-2">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                <input type="text" id="searchInput" class="bg-transparent border-none outline-none text-sm w-full" placeholder="搜尋創作者名稱..." data-i18n="search_placeholder">
            </div>
            <button onclick="toggleSearch(false)" class="text-gray-500 font-bold">取消</button>
        </div>
        <div id="searchResults" class="flex-1 overflow-y-auto p-4 space-y-4">
            </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-700 pb-20">
        
        <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-black italic tracking-tighter text-sexify">SEXIFY</h1>
            <div class="flex gap-4">
                <button onclick="toggleSearch(true)" class="text-xl text-gray-700"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button onclick="toggleSettings()" class="text-xl text-gray-700"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </header>

        <main>
            <section id="home-tab" class="tab-content active">
                <div id="discovery-grid" class="masonry-grid"></div>
            </section>

            <section id="shop-tab" class="tab-content">
                <div id="shop-grid" class="grid grid-cols-1 gap-4 p-4"></div>
            </section>

            <section id="messages-tab" class="tab-content">
                <div id="inbox-container" class="p-4 space-y-4"></div>
            </section>

            <section id="profile-tab" class="tab-content">
                <div id="my-profile-container"></div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-3 z-50">
            <button onclick="switchTab('home-tab', this)" class="nav-btn nav-active"><i class="fa-solid fa-house"></i></button>
            <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400"><i class="fa-solid fa-bag-shopping"></i></button>
            <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400"><i class="fa-solid fa-comment-dots"></i></button>
            <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400"><i class="fa-solid fa-user"></i></button>
        </nav>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-[400] bg-black/60 hidden flex items-center justify-center p-6">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/search.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/profile.js"></script>
    <script>
        function toggleSearch(show) {
            document.getElementById('search-overlay').classList.toggle('active', show);
        }
    </script>
</body>
</html>
