<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .image-loading {
            background-image: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 37%, #f3f4f6 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <!-- 年齡驗證 -->
    <div id="age-gate" class="fixed inset-0 z-[3000] bg-black flex items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-10 rounded-[2.5rem] w-11/12 max-w-sm text-center shadow-2xl">
            <h2 class="text-4xl font-black text-sexify mb-3">SEXIFY</h2>
            <p class="text-gray-400 text-sm mb-8" data-i18n="age_title">此空間包含成人內容<br><span data-i18n="age_desc">進入即代表您已滿 18 歲</span></p>
            <button onclick="verifyAge()" class="w-full bg-sexify text-white py-4 rounded-full font-bold shadow-lg active:scale-95 transition" data-i18n="age_btn">確認進入</button>
        </div>
    </div>

    <!-- 左側設定抽屜 -->
    <div id="settings-drawer" class="fixed inset-0 z-[1700] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="toggleSettings()"></div>
        <div id="settings-panel" class="absolute top-0 left-0 bottom-0 w-4/5 max-w-sm bg-white -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
            <div class="p-6 bg-sexify text-white">
                <h2 class="text-xl font-black mb-4" data-i18n="settings">設定與數據</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/20 rounded-xl p-3 backdrop-blur-sm">
                        <p class="text-[10px] opacity-80" data-i18n="stats_subs">訂閱人數</p>
                        <p class="text-lg font-black mt-1">12,405</p>
                    </div>
                    <div class="bg-white/20 rounded-xl p-3 backdrop-blur-sm">
                        <p class="text-[10px] opacity-80" data-i18n="stats_rev">本月收入</p>
                        <p class="text-lg font-black mt-1">$4,280</p>
                    </div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto py-4">
                <button onclick="openPersonalCenter()" class="w-full px-6 py-4 flex items-center gap-4 text-left hover:bg-gray-50 active:bg-gray-100 transition text-gray-800 font-bold"><i class="fa-solid fa-user-shield w-5"></i> <span data-i18n="menu_personal">個人中心</span></button>
                <button onclick="openFansSubsModal()" class="w-full px-6 py-4 flex items-center gap-4 text-left hover:bg-gray-50 active:bg-gray-100 transition text-gray-800 font-bold"><i class="fa-solid fa-users w-5"></i> <span data-i18n="menu_fans_subs">粉絲與訂閱用戶</span></button>
                <div class="h-px bg-gray-100 my-2"></div>
                <button onclick="toggleLanguage()" class="w-full px-6 py-4 flex items-center gap-4 text-left hover:bg-gray-50 active:bg-gray-100 transition text-gray-700 font-bold"><i class="fa-solid fa-language w-5"></i> <span data-i18n="menu_lang">切換語言 (EN/ZH)</span></button>
                <button onclick="if(confirm('確定要登出帳號嗎？')) location.reload();" class="w-full px-6 py-4 flex items-center gap-4 text-left hover:bg-gray-50 active:bg-gray-100 transition text-red-500 font-bold"><i class="fa-solid fa-right-from-bracket w-5"></i> <span data-i18n="menu_logout">登出帳號</span></button>
            </div>
        </div>
    </div>

    <!-- 主內容區塊 -->
    <div id="app-content" class="blur-2xl pointer-events-none pb-24">
        <!-- 首頁 Tab -->
        <div id="home-tab" class="tab-content active">
            <div class="p-4 pt-6 flex justify-between items-center gap-3 bg-white/80 backdrop-blur-md sticky top-0 z-[100]">
                <button onclick="toggleSettings()" class="text-gray-800 text-xl active:scale-90 transition"><i class="fa-solid fa-bars"></i></button>
                <div class="flex-1 relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400 text-sm"></i>
                    <input type="text" id="home-search" oninput="handleSearch()" data-i18n="search_placeholder" placeholder="搜尋用戶或內容..." class="w-full bg-gray-100 rounded-full py-2 pl-9 pr-10 text-sm outline-none focus:ring-2 focus:ring-sexify/20 transition">
                </div>
            </div>
            <div class="masonry-grid" id="discovery-grid"></div>
        </div>

        <!-- 商城 Tab -->
        <div id="shop-tab" class="tab-content">
            <div class="p-4 pt-6 flex justify-between items-center gap-3 bg-white/80 backdrop-blur-md sticky top-0 z-[100]">
                <button onclick="toggleSettings()" class="text-gray-800 text-xl active:scale-90 transition"><i class="fa-solid fa-bars"></i></button>
                <h1 class="text-2xl font-black text-gray-800" data-i18n="shop_title">商城</h1>
            </div>
            <div id="shop-grid" class="p-4 grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 訊息 Tab (已修正搜尋框結構) -->
        <div id="messages-tab" class="tab-content">
            <div class="p-4 pt-6 bg-white/90 backdrop-blur-md sticky top-0 z-[100] flex flex-col gap-4 border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSettings()" class="text-gray-800 text-xl active:scale-90 transition"><i class="fa-solid fa-bars"></i></button>
                    <h1 class="text-2xl font-black text-gray-800" data-i18n="msg_title">訊息</h1>
                </div>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400 text-sm"></i>
                    <input type="text" id="msg-search-input" placeholder="搜尋聊天紀錄或用戶..." class="w-full bg-gray-100 rounded-full py-2.5 pl-10 pr-4 text-sm outline-none focus:ring-2 focus:ring-sexify/20 transition">
                </div>
            </div>
            <div id="messages-list" class="divide-y divide-gray-50 pb-10"></div>
        </div>

        <!-- 個人 Tab -->
        <div id="profile-tab" class="tab-content">
            <div class="bg-white relative">
                <div class="relative w-full h-36 bg-gray-200 group">
                    <img id="my-banner" src="" class="w-full h-full object-cover">
                </div>
                <div class="px-5 pb-5 relative -mt-10 flex justify-between items-end mb-3">
                    <img id="my-avatar" src="" class="w-24 h-24 rounded-full border-4 border-white object-cover bg-white shadow-sm">
                </div>
                <div class="px-5 pb-4">
                    <h2 id="my-name" class="text-xl font-black text-gray-800"></h2>
                    <p id="my-bio" class="text-sm text-gray-600 mt-2"></p>
                </div>
            </div>
            <div id="user-gallery" class="grid grid-cols-3 gap-1 bg-white"></div>
        </div>
    </div>

    <!-- 底部導航 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-100 flex justify-around items-center py-2 pb-6 z-[500]">
        <button class="nav-btn nav-active flex flex-col items-center gap-1" onclick="switchTab('home-tab', this)"><i class="fa-solid fa-house"></i><span class="text-[10px]" data-i18n="nav_home">首頁</span></button>
        <button class="nav-btn text-gray-400 flex flex-col items-center gap-1" onclick="switchTab('shop-tab', this)"><i class="fa-solid fa-bag-shopping"></i><span class="text-[10px]" data-i18n="nav_shop">商城</span></button>
        <button class="nav-btn text-gray-400 flex flex-col items-center gap-1" onclick="switchTab('messages-tab', this)"><i class="fa-solid fa-message"></i><span class="text-[10px]" data-i18n="nav_msg">訊息</span></button>
        <button class="nav-btn text-gray-400 flex flex-col items-center gap-1" onclick="switchTab('profile-tab', this)"><i class="fa-solid fa-user"></i><span class="text-[10px]" data-i18n="nav_me">我</span></button>
    </div>

    <!-- 聊天對話 Modal (已加入群組加人按鈕) -->
    <div id="chat-modal" class="fixed inset-0 z-[2100] bg-white translate-x-full transition-transform duration-300 hidden flex flex-col">
        <div class="p-4 border-b flex items-center justify-between bg-white sticky top-0 z-10 shadow-sm">
            <div class="flex items-center gap-3 overflow-hidden">
                <button onclick="closeChat()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full active:scale-90 transition"><i class="fa-solid fa-chevron-left"></i></button>
                <img id="chat-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-gray-100">
                <h3 id="chat-name" class="font-black text-sm text-gray-800 truncate"></h3>
            </div>
            <!-- 群組專用：新增成員按鈕 -->
            <button id="add-to-group-btn" onclick="openAddGroupMemberModal()" class="hidden w-8 h-8 items-center justify-center bg-sexify/10 text-sexify rounded-full active:scale-90 transition">
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 flex flex-col-reverse relative"></div>
        
        <div class="p-4 border-t bg-white flex items-center gap-3 pb-8">
            <button onclick="document.getElementById('chat-image-input').click()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-sexify active:scale-90 transition text-lg flex-shrink-0"><i class="fa-solid fa-image"></i></button>
            <input type="file" id="chat-image-input" accept="image/*" class="hidden" onchange="handleImageSelection(this)">
            <input type="text" id="chat-input" placeholder="發送訊息..." class="flex-1 bg-gray-100 rounded-full px-5 py-3 outline-none text-sm">
            <button onclick="handleSendAction()" class="bg-sexify text-white font-bold px-5 py-2.5 rounded-full shadow-md active:scale-95 transition flex-shrink-0" data-i18n="send">發送</button>
        </div>
    </div>

    <!-- 群組加人 Modal -->
    <div id="add-member-modal" class="fixed inset-0 z-[2200] bg-white translate-y-full transition-transform duration-300 hidden flex flex-col">
        <div class="p-4 border-b flex items-center gap-3 sticky top-0 bg-white shadow-sm">
            <button onclick="closeAddGroupMemberModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full active:scale-90 transition"><i class="fa-solid fa-chevron-down"></i></button>
            <h3 class="font-black text-gray-800">加入新成員</h3>
        </div>
        <div id="add-member-list" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- 動態渲染可用戶名單 -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
