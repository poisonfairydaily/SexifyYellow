<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-4">此空間包含成人內容</h1>
            <p class="text-gray-400 mb-8">進入即表示您確認已滿 18 歲，並願意觀看此類內容。</p>
            <button onclick="verifyAge()" class="bg-sexify text-white font-bold py-3 px-12 rounded-full text-lg shadow-[0_0_20px_rgba(255,36,66,0.4)] active:scale-95 transition">我已滿18歲，進入</button>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex flex-col justify-center px-6 hidden">
        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <h2 id="auth-title" class="text-3xl font-black mb-2 text-center">SEXIFY</h2>
            <p id="auth-subtitle" class="text-gray-500 text-center mb-6 text-sm">登入以繼續探索</p>
            
            <div class="space-y-4">
                <div id="auth-register-only-fields" class="hidden space-y-4">
                    <input type="text" id="auth-display-name" placeholder="顯示名稱 (如: 王小明)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition">
                    <input type="text" id="auth-username" placeholder="唯一帳號名 (如: ming123)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition">
                    <select id="auth-gender" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition text-gray-500">
                        <option value="Unspecified" disabled selected>選擇您的性別</option>
                        <option value="Male">男性</option><option value="Female">女性</option><option value="Other">其他 / 不便透露</option>
                    </select>
                    <div>
                        <label class="text-xs text-gray-500 ml-1 mb-1 block">生日 (須滿18歲方可註冊)</label>
                        <input type="date" id="auth-birthday" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition">
                    </div>
                    <div class="flex items-start gap-2 mt-2">
                        <input type="checkbox" id="auth-tos" class="mt-1 accent-sexify">
                        <label for="auth-tos" class="text-xs text-gray-500 leading-tight">我同意服務條款，並聲明我已年滿 18 歲，知悉本站包含成人限制級內容。</label>
                    </div>
                </div>

                <input type="email" id="auth-email" placeholder="電子信箱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition">
                <input type="password" id="auth-password" placeholder="密碼 (至少6位數)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sexify transition">
                
                <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white font-bold py-3 rounded-xl shadow-lg shadow-sexify/30 active:scale-95 transition mt-2">登入</button>
            </div>
            
            <div class="mt-6 text-center text-sm">
                <span id="auth-switch-text" class="text-gray-500">還沒有帳號嗎？</span> 
                <button id="auth-switch-btn" onclick="toggleAuthMode()" class="text-sexify font-bold">立即註冊</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-500 h-screen overflow-hidden flex flex-col relative">
        
        <header class="bg-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm border-b">
            <button onclick="alert('設置功能即將開放')" class="text-gray-700 active:scale-90 transition w-8 text-left">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h1 class="text-2xl font-black italic tracking-tighter text-sexify flex-1 text-center">
                SEXIFY
            </h1>
            <div class="flex gap-4 items-center w-auto justify-end">
                <button onclick="toggleSearch(true)" class="text-gray-700 active:scale-90 transition"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
                <button onclick="alert('目前沒有新通知')" class="text-gray-700 relative active:scale-90 transition">
                    <i class="fa-regular fa-bell text-xl"></i><span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-sexify rounded-full border border-white"></span>
                </button>
            </div>
        </header>

        <div id="search-overlay" class="search-overlay">
            <div class="flex items-center gap-3 p-4 border-b bg-white">
                <button onclick="toggleSearch(false)" class="text-gray-500"><i class="fa-solid fa-arrow-left text-xl"></i></button>
                <div class="flex-1 bg-gray-100 rounded-full flex items-center px-4 py-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" placeholder="搜尋帳號、暱稱或關鍵字..." class="bg-transparent border-none outline-none w-full text-sm">
                </div>
            </div>
            <div id="searchResults" class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <div class="text-center text-gray-400 mt-10 text-sm">請輸入關鍵字開始搜尋...</div>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto pb-24 relative">
            
            <div id="home-tab" class="tab-content block h-full">
                <div class="px-4 py-3 flex gap-3 overflow-x-auto border-b bg-white sticky top-0 z-40 hide-scrollbar shadow-sm">
                    <button class="bg-black text-white px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shadow-md">為你推薦</button>
                    <button class="bg-gray-100 text-gray-600 px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">追蹤中</button>
                    <button class="bg-gray-100 text-gray-600 px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">最新動態</button>
                </div>
                <div id="discovery-grid" class="masonry-grid p-2 pb-20 bg-gray-100"></div>
            </div>

            <div id="shop-tab" class="tab-content hidden h-full bg-gray-50 p-4">
                <div class="bg-black text-white rounded-2xl p-6 mb-6 shadow-xl relative overflow-hidden">
                    <div class="relative z-10">
                        <h2 class="text-2xl font-black mb-1">SEXIFY 商城</h2>
                        <p class="text-sm text-gray-300 opacity-90">解鎖專屬圖集與私密互動</p>
                    </div>
                </div>
                <div id="shop-grid" class="grid grid-cols-2 gap-4 pb-20"></div>
            </div>

            <div id="messages-tab" class="tab-content hidden h-full bg-white flex-col">
                <div class="p-4 border-b">
                    <div class="bg-gray-100 rounded-xl flex items-center px-4 py-2.5">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                        <input type="text" id="inbox-search-input" placeholder="搜尋對話..." class="bg-transparent border-none outline-none w-full text-sm" oninput="searchUsersToChat()">
                    </div>
                </div>
                <div id="chat-list" class="flex-1 overflow-y-auto pb-20"></div>
            </div>

            <div id="profile-tab" class="tab-content hidden h-full bg-gray-50 pb-20">
                <div id="my-profile-container"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-50">
            <div class="flex justify-between items-end pb-4 pt-2 px-6 relative">
                <button onclick="switchTab('home-tab', this)" class="nav-btn nav-active flex flex-col items-center flex-1"><i class="fa-solid fa-house mb-1 text-xl"></i><span class="text-[10px] font-bold">首頁</span></button>
                <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1"><i class="fa-solid fa-store mb-1 text-xl"></i><span class="text-[10px] font-bold">商城</span></button>
                
                <div class="flex-1 flex justify-center relative -top-6">
                    <button onclick="openUploadModal()" class="w-14 h-14 bg-sexify text-white rounded-full flex justify-center items-center shadow-[0_10px_20px_rgba(255,36,66,0.4)] active:scale-95 transition-transform absolute border-4 border-white">
                        <i class="fa-solid fa-plus text-2xl"></i>
                    </button>
                </div>

                <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1 relative"><i class="fa-solid fa-comment-dots mb-1 text-xl"></i><span class="text-[10px] font-bold">訊息</span></button>
                <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1"><i class="fa-regular fa-user mb-1 text-xl"></i><span class="text-[10px] font-bold">我</span></button>
            </div>
        </nav>
    </div>

    <div id="upload-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] hidden flex-col justify-end transition-opacity">
        <div id="upload-panel" class="bg-white w-full h-[90vh] rounded-t-3xl shadow-2xl flex flex-col transform translate-y-full transition-transform duration-300">
            <div class="flex justify-between items-center p-4 border-b">
                <button onclick="closeUploadModal()" class="text-gray-500 font-bold px-2">取消</button>
                <h3 class="font-black text-lg">發佈新內容</h3>
                <button onclick="publishPost()" class="bg-sexify text-white px-4 py-1.5 rounded-full font-bold text-sm">發佈</button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <textarea id="post-caption" placeholder="寫些什麼..." class="w-full text-lg outline-none resize-none min-h-[100px] mb-4"></textarea>
                <div id="media-preview-container" class="w-full h-64 bg-gray-100 rounded-2xl mb-4 relative flex items-center justify-center overflow-hidden border border-gray-200">
                    <img id="media-preview" class="w-full h-full object-cover hidden">
                    <video id="video-preview" class="w-full h-full object-cover hidden" controls></video>
                    <div id="media-placeholder" class="text-center text-gray-400 pointer-events-none">
                        <i class="fa-solid fa-image text-3xl mb-2"></i>
                        <p class="text-sm font-bold">預覽區域</p>
                    </div>
                </div>
                <div class="flex gap-4 mb-6">
                    <label class="flex-1 bg-gray-50 border border-gray-200 py-3 rounded-xl flex justify-center items-center gap-2 font-bold text-gray-600 active:scale-95 transition">
                        <i class="fa-solid fa-camera text-sexify"></i> 相片
                        <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    </label>
                    <label class="flex-1 bg-gray-50 border border-gray-200 py-3 rounded-xl flex justify-center items-center gap-2 font-bold text-gray-600 active:scale-95 transition">
                        <i class="fa-solid fa-video text-blue-500"></i> 影片
                        <input type="file" id="video-upload" accept="video/*" class="hidden" onchange="handleFileSelect(event)">
                    </label>
                </div>
                <div class="border border-gray-200 rounded-xl p-4 bg-gray-50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-700">設定為付費內容</span>
                        <input type="checkbox" id="post-is-paid" class="w-5 h-5 accent-sexify">
                    </div>
                    <input type="number" id="post-price" placeholder="設定解鎖金幣數量 (如: 50)" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-sexify mt-2">
                </div>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-white z-[300] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="bg-white/90 backdrop-blur-md border-b flex items-center p-4 sticky top-0 z-10 shadow-sm">
            <button onclick="closeChat()" class="text-gray-700 w-10 h-10 flex items-center justify-center -ml-2 active:scale-90 transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
            <div class="flex items-center gap-3 ml-2 flex-1">
                <div class="relative">
                    <img id="chat-target-avatar" src="" class="w-10 h-10 rounded-full object-cover shadow-sm border border-gray-100">
                    <span id="chat-target-status" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div class="flex flex-col">
                    <span id="chat-target-name" class="font-bold text-gray-900 leading-tight">載入中...</span>
                    <span id="chat-typing-indicator" class="text-xs text-sexify hidden transition-all duration-300">正在輸入訊息...</span>
                </div>
            </div>
            <button class="text-gray-700 w-10 h-10"><i class="fa-solid fa-ellipsis-vertical text-lg"></i></button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 bg-gray-50 relative"></div>
        <div class="p-3 bg-white border-t relative">
            <div id="media-preview-area" class="hidden absolute bottom-full left-0 w-full p-2 bg-white border-t flex gap-2 overflow-x-auto shadow-lg rounded-t-xl"></div>
            <div class="flex items-end gap-2">
                <button onclick="document.getElementById('chat-media-input').click()" class="text-gray-400 p-2 active:scale-90 transition"><i class="fa-solid fa-image text-xl"></i></button>
                <input type="file" id="chat-media-input" accept="image/*,video/*" class="hidden" onchange="previewMedia(event)">
                <div class="flex-1 bg-gray-100 rounded-2xl flex items-end px-4 py-2 min-h-[44px]">
                    <textarea id="chat-input-text" rows="1" placeholder="發送訊息..." class="bg-transparent border-none outline-none w-full resize-none text-sm max-h-[100px] py-1" oninput="handleTyping()"></textarea>
                </div>
                <button id="send-btn" onclick="sendMessage()" class="bg-sexify text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md active:scale-90 transition disabled:opacity-50"><i class="fa-solid fa-paper-plane text-sm"></i></button>
            </div>
        </div>
    </div>

    <div id="comment-sheet" class="fixed inset-0 bg-black/50 z-[200] hidden flex-col justify-end">
        <div id="comment-panel" class="bg-white w-full h-[70vh] rounded-t-3xl transform translate-y-full transition-transform duration-300 flex flex-col">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="font-bold text-lg">留言</h3>
                <button onclick="closeComments()" class="text-gray-500 w-8 h-8 rounded-full bg-gray-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="comment-list" class="flex-1 overflow-y-auto p-4"></div>
            <div class="p-4 border-t flex gap-2">
                <input type="text" id="comment-input" placeholder="新增留言..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none">
                <button onclick="sendComment()" class="text-sexify font-bold px-4">發佈</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
    
    <script>
        function toggleSearch(show) {
            const overlay = document.getElementById('search-overlay');
            if(overlay) {
                if (show) overlay.classList.add('active');
                else overlay.classList.remove('active');
            }
        }
    </script>
</body>
</html>
