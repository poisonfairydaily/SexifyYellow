<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        /* 動畫效果 */
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-4">此空間包含成人內容</h1>
            <p class="text-gray-400 mb-8">進入即表示您確認已滿 18 歲，並願意觀看此類內容。</p>
            <button onclick="verifyAge()" class="bg-sexify text-white font-bold py-3 px-12 rounded-full text-lg shadow-[0_0_20px_rgba(255,36,66,0.4)] active:scale-95 transition">我已滿18歲，進入</button>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[400] flex flex-col justify-center px-6 hidden">
        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <h2 id="auth-title" class="text-3xl font-black mb-2 text-center">SEXIFY</h2>
            <p id="auth-subtitle" class="text-gray-500 text-center mb-6 text-sm">登入以繼續探索</p>
            
            <div class="space-y-4">
                <div id="auth-register-only-fields" class="hidden space-y-4">
                    <input type="text" id="auth-display-name" placeholder="顯示名稱 (如: 王小明)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <input type="text" id="auth-username" placeholder="唯一帳號名 (如: ming123)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <select id="auth-gender" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition text-gray-500">
                        <option value="Unspecified" disabled selected>選擇您的性別</option>
                        <option value="Male">男性</option><option value="Female">女性</option><option value="Other">其他 / 不便透露</option>
                    </select>
                    <div>
                        <label class="text-xs text-gray-500 ml-1 mb-1 block">生日 (須滿18歲方可註冊)</label>
                        <input type="date" id="auth-birthday" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    </div>
                    <div class="flex items-start gap-2 mt-2">
                        <input type="checkbox" id="auth-tos" class="mt-1 accent-sexify">
                        <label for="auth-tos" class="text-xs text-gray-500 leading-tight">我同意服務條款，並聲明我已年滿 18 歲，知悉本站包含成人限制級內容。</label>
                    </div>
                </div>

                <input type="email" id="auth-email" placeholder="電子信箱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                <input type="password" id="auth-password" placeholder="密碼 (至少6位數)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                
                <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white font-bold py-3 rounded-xl shadow-lg shadow-sexify/30 active:scale-95 transition mt-2">登入</button>
            </div>
            
            <div class="mt-6 text-center text-sm">
                <span id="auth-switch-text" class="text-gray-500">還沒有帳號嗎？</span> 
                <button id="auth-switch-btn" onclick="toggleAuthMode()" class="text-sexify font-bold">立即註冊</button>
            </div>

            <div class="flex justify-end mt-4 px-2">
                <button type="button" onclick="toggleForgotModal(true)" class="text-[11px] text-gray-400 hover:text-sexify transition-colors font-medium">
                    忘記密碼？
                </button>
            </div>
        </div>
    </div>

    <div id="forgot-password-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9999] hidden items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative animate-fade-in">
            <button onclick="toggleForgotModal(false)" class="absolute top-6 right-6 text-gray-400 hover:text-black transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-2xl font-black text-gray-900 mb-2">找回密碼</h2>
            <p class="text-gray-400 text-[11px] mb-8 uppercase tracking-widest font-bold">Reset your password</p>
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">Email Address</label>
                    <input type="email" id="modal-reset-email" placeholder="輸入您的註冊信箱" 
                        class="w-full p-4 bg-gray-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-black outline-none transition-all">
                </div>
                <button onclick="handleModalResetRequest()" id="modal-reset-btn" 
                    class="w-full bg-black text-white p-4 rounded-2xl font-bold text-sm hover:opacity-90 transition-all active:scale-95">
                    發送重設郵件
                </button>
                <p id="modal-message" class="text-center text-[11px] font-medium min-h-[1rem]"></p>
            </div>
        </div>
    </div>

    <div id="settings-drawer" class="fixed inset-0 z-[200] hidden bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleSettings()">
        <div id="settings-panel" class="absolute left-0 top-0 bottom-0 w-72 bg-white transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-black text-lg" data-i18n="settings">設定與數據</h2>
                <button onclick="toggleSettings()" class="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="flex-1 overflow-y-auto py-4">
                <div class="px-6 space-y-2">
                    <button onclick="openPersonalCenter()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-id-card"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_personal">個人中心</span>
                    </button>
                    <button onclick="openFansSubsModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                        <div class="w-10 h-10 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center"><i class="fa-solid fa-heart"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_fans_subs">粉絲與訂閱用戶</span>
                    </button>
                    <button onclick="openBookmarksModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                        <div class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center"><i class="fa-solid fa-bookmark"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_bookmarks">我的收藏</span>
                    </button>
                    <button onclick="toggleMyOrders()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                        <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-bag-shopping"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_orders">訂單記錄</span>
                    </button>
                    <button onclick="openContactModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                        <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center"><i class="fa-solid fa-envelope"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_contact">聯絡我們</span>
                    </button>
                    <button onclick="toggleLanguage()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95 mt-4 border-t border-gray-100 pt-6">
                        <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i class="fa-solid fa-earth-americas"></i></div>
                        <span class="font-bold text-gray-700" data-i18n="menu_lang">切換語言 (EN/ZH)</span>
                    </button>
                </div>
            </div>
            <div class="p-6 border-t bg-gray-50">
                <button id="logout-btn" class="w-full flex items-center justify-center gap-2 bg-white border-2 border-gray-200 text-gray-700 font-bold py-3.5 rounded-2xl active:scale-95 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i><span data-i18n="menu_logout">登出帳號</span>
                </button>
            </div>
        </div>
    </div>

    <div id="notification-drawer" class="fixed inset-0 z-[200] hidden bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleNotifications()">
        <div id="notification-panel" class="absolute right-0 top-0 bottom-0 w-72 bg-white transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="p-4 border-b flex justify-between items-center bg-gray-50">
                <button onclick="toggleNotifications()" class="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
                <h2 class="font-black text-lg">系統通知</h2>
            </header>
            <div id="notification-list" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-3"></div>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-500 h-screen overflow-hidden flex flex-col relative">
        <header class="bg-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm border-b">
            <button onclick="toggleSettings()" class="text-gray-700 active:scale-90 transition w-8 text-left">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h1 class="text-2xl font-black italic tracking-tighter text-sexify flex-1 text-center">SEXIFY</h1>
            <div class="flex gap-4 items-center w-auto justify-end">
                <button onclick="toggleNotifications()" class="text-gray-700 relative active:scale-90 transition">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span id="notification-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-sexify rounded-full border border-white hidden"></span>
                </button>
            </div>
        </header>

        <div id="search-overlay" class="search-overlay">
            <div class="flex items-center gap-3 p-4 border-b bg-white">
                <button onclick="toggleSearch(false)" class="text-gray-500 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <div class="flex-1 bg-gray-100 rounded-full flex items-center px-4 py-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" placeholder="搜尋用戶帳號、暱稱..." class="bg-transparent border-none outline-none w-full text-sm">
                </div>
            </div>
            <div id="searchResults" class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <div class="text-center text-gray-400 mt-10 text-sm">請在上方輸入關鍵字開始搜尋...</div>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto pb-24 relative">
            <div id="home-tab" class="tab-content block h-full">
                <div class="px-4 py-3 flex gap-3 overflow-x-auto border-b bg-white sticky top-0 z-40 hide-scrollbar shadow-sm">
                    <button class="bg-black text-white px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shadow-md">為你推薦</button>
                    <button class="bg-gray-100 text-gray-600 px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">追蹤中</button>
                </div>
                <div id="discovery-grid" class="masonry-grid p-2 pb-20 bg-gray-100"></div>
            </div>

            <div id="shop-tab" class="tab-content hidden h-full bg-gray-50 p-4 overflow-y-auto">
                <div class="bg-[#1a1a1a] text-white rounded-2xl p-5 mb-6 shadow-xl relative overflow-hidden">
                    <div class="relative z-10 flex items-center justify-between gap-2">
                        <div class="flex-1 min-w-0 pr-2">
                            <h2 class="text-xl font-black mb-0.5 italic truncate">SEXIFY 商城</h2>
                            <p class="text-[10px] text-gray-400 opacity-90 truncate">解鎖專屬圖集與私密互動</p>
                        </div>
                        <div class="flex-shrink-0 flex items-center gap-1.5">
                            <div class="flex flex-col items-end mr-1">
                                <span class="text-[8px] text-gray-500 uppercase tracking-tighter mb-0.5">我的餘額</span>
                                <span class="text-sm font-black text-sexify leading-none">🪙 <span id="shop-balance-display">--</span></span>
                            </div>
                            <button onclick="window.toggleMyOrders()" class="bg-white/10 hover:bg-white/20 text-white h-[32px] px-3 rounded-full border border-white/10 text-[11px] transition-all active:scale-95 flex items-center gap-1.5 font-bold">
                                <i class="fa-solid fa-box-open text-[12px]"></i>
                                <span>庫存</span>
                            </button>
                            <button onclick="window.toggleRechargeArea()" class="bg-sexify text-white w-[32px] h-[32px] flex items-center justify-center rounded-full shadow-lg shadow-sexify/20 transition-all active:scale-90">
                                <i id="recharge-icon" class="fa-solid fa-plus text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div id="recharge-drawer" style="display: none;" class="mt-5 pt-4 border-t border-white/10 relative z-20">
                        <p class="text-[11px] text-gray-400 mb-2">請輸入充值美金 (最低 $20 USD)</p>
                        <div class="flex items-center gap-3">
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                                <input type="number" id="rechargeAmount" value="20" min="20" class="w-full bg-white/10 border border-white/20 rounded-xl py-2.5 pl-7 pr-3 text-sm text-white focus:outline-none focus:border-sexify transition-all font-bold">
                            </div>
                            <button onclick="payNow()" class="bg-white text-black font-black px-6 py-2.5 rounded-xl text-sm hover:bg-gray-200 active:scale-95 transition-all">儲值</button>
                        </div>
                    </div>
                    <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-sexify/20 rounded-full blur-3xl z-0 pointer-events-none"></div>
                </div>
                <div id="shop-grid" class="grid grid-cols-2 gap-4 pb-32"></div>
            </div>

            <div id="messages-tab" class="tab-content hidden h-full bg-white flex-col">
                <div class="p-4 border-b"><div class="bg-gray-100 rounded-xl flex items-center px-4 py-2.5"><i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i><input type="text" id="inbox-search-input" placeholder="在收件匣中搜尋..." class="bg-transparent border-none outline-none w-full text-sm"></div></div>
                <div id="chat-list" class="flex-1 overflow-y-auto pb-20"></div>
            </div>

            <div id="profile-tab" class="tab-content hidden h-full bg-gray-50 pb-20"><div id="my-profile-container"></div></div>
        </main>

        <nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-50 h-[68px]">
            <div class="flex justify-between items-center h-full px-4 relative">
                <button onclick="switchTab('home-tab', this)" class="nav-btn nav-active flex flex-col items-center flex-1"><i class="fa-solid fa-house mb-1 text-xl"></i><span class="text-[10px] font-bold" data-i18n="nav_home">首頁</span></button>
                <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1 pr-6"><i class="fa-solid fa-store mb-1 text-xl"></i><span class="text-[10px] font-bold" data-i18n="nav_shop">商城</span></button>
                <div class="absolute left-1/2 -translate-x-1/2 -top-5 z-50">
                    <button onclick="openUploadModal()" class="w-14 h-14 bg-sexify text-white rounded-full flex justify-center items-center shadow-[0_8px_16px_rgba(255,36,66,0.4)] active:scale-95 transition-transform border-4 border-white"><i class="fa-solid fa-plus text-2xl font-black"></i></button>
                </div>
                <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1 pl-6 relative"><i class="fa-solid fa-comment-dots mb-1 text-xl relative"><span id="nav-msg-badge" class="absolute -top-1 -right-1 w-2 h-2 bg-sexify rounded-full hidden"></span></i><span class="text-[10px] font-bold" data-i18n="nav_msg">訊息</span></button>
                <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1"><i class="fa-regular fa-user mb-1 text-xl"></i><span class="text-[10px] font-bold" data-i18n="nav_me">我</span></button>
            </div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
