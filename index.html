<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center">
            <h1 class="text-white text-4xl font-black mb-4 tracking-tighter">SEXIFY</h1>
            <p class="text-gray-400 mb-8 text-sm">您必須年滿 18 歲才能進入此網站</p>
            <button onclick="verifyAge()" class="bg-sexify text-white px-10 py-4 rounded-full font-bold text-lg active:scale-95 transition shadow-2xl shadow-sexify/20">
                我已滿 18 歲
            </button>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-700">
        
        <header class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-40 border-b px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black tracking-tighter text-sexify">SEXIFY</h1>
            <div class="flex items-center gap-4">
                <button id="global-search-btn" onclick="toggleSearch(true)" class="text-gray-600 active:scale-90 transition"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
                <button onclick="toggleLanguage()" class="text-gray-600 active:scale-90 transition"><i class="fa-solid fa-globe text-xl"></i></button>
            </div>
        </header>

        <div id="search-overlay" class="search-overlay">
            <div class="p-4 flex items-center gap-3 border-b">
                <button onclick="toggleSearch(false)" class="text-gray-500 p-2"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <div class="flex-1 bg-gray-100 rounded-xl px-4 py-2 flex items-center">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" placeholder="搜尋用戶..." class="bg-transparent border-none outline-none w-full text-sm">
                </div>
            </div>
            <div id="searchResults" class="flex-1 overflow-y-auto p-4">
                <div class="text-center text-gray-400 mt-10 text-sm" data-i18n="search_placeholder">請在上方輸入關鍵字開始搜尋...</div>
            </div>
        </div>

        <main class="pt-16 pb-20">
            <div id="home-tab" class="tab-content">
                <div class="flex justify-center border-b bg-white sticky top-[60px] z-30">
                    <button id="tab-recommend" onclick="switchDiscoveryMode('all')" class="px-6 py-3 text-sm font-bold border-b-2 border-sexify text-sexify">推薦</button>
                    <button id="tab-following" onclick="switchDiscoveryMode('following')" class="px-6 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400">追蹤中</button>
                </div>
                <div id="discovery-grid" class="masonry-grid"></div>
            </div>

            <div id="shop-tab" class="tab-content hidden">
                <div id="shop-container" class="min-h-screen bg-white"></div>
            </div>

            <div id="messages-tab" class="tab-content hidden h-[calc(100vh-120px)]">
                <div class="p-4 border-b flex items-center justify-between bg-white">
                    <h2 class="text-xl font-bold" data-i18n="msg_title">訊息</h2>
                    <div class="relative w-2/3">
                        <input type="text" id="inbox-search-input" oninput="searchUsersToChat()" placeholder="搜尋對話..." class="w-full bg-gray-100 rounded-full px-4 py-1.5 text-xs outline-none">
                    </div>
                </div>
                <div id="chat-list" class="flex-1 overflow-y-auto space-y-1 p-2"></div>
            </div>

            <div id="profile-tab" class="tab-content hidden">
                <div class="p-6">
                    <div id="my-profile-header" class="flex items-center gap-6 mb-8">
                        <img id="my-avatar" src="https://ui-avatars.com/api/?name=User" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-xl">
                        <div class="flex-1">
                            <h2 id="my-display-name" class="text-2xl font-black mb-1">載入中...</h2>
                            <p id="my-username" class="text-gray-400 text-sm">@...</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-center">
                            <div id="stat-subs" class="text-xl font-black">0</div>
                            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest" data-i18n="stats_subs">訂閱人數</div>
                        </div>
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm text-center">
                            <div id="stat-rev" class="text-xl font-black text-sexify">$0</div>
                            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest" data-i18n="stats_rev">本月收入</div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="openEditProfile()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold active:scale-95 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-pen"></i> <span data-i18n="edit_profile">編輯資料</span>
                        </button>
                        <div class="grid grid-cols-1 gap-2">
                            <button onclick="openFansSubsModal()" class="w-full bg-white border border-gray-100 py-4 px-6 rounded-2xl font-bold text-left flex items-center justify-between active:bg-gray-50 transition">
                                <span data-i18n="menu_fans_subs">粉絲與訂閱用戶</span> <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                            </button>
                            <button onclick="toggleLanguage()" class="w-full bg-white border border-gray-100 py-4 px-6 rounded-2xl font-bold text-left flex items-center justify-between active:bg-gray-50 transition">
                                <span data-i18n="menu_lang">切換語言 (EN/ZH)</span> <i class="fa-solid fa-globe text-gray-300 text-xs"></i>
                            </button>
                            <button id="logout-btn" class="w-full bg-white border border-gray-100 py-4 px-6 rounded-2xl font-bold text-left text-red-500 flex items-center justify-between active:bg-gray-50 transition">
                                <span data-i18n="menu_logout">登出帳號</span> <i class="fa-solid fa-right-from-bracket text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="border-t pt-4 px-6">
                    <h3 class="font-black text-lg mb-4">我的作品</h3>
                    <div id="my-posts-grid" class="masonry-grid"></div>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl border-t flex justify-around items-center py-3 z-40 pb-safe">
            <button onclick="switchTab('home-tab', this)" class="nav-btn nav-active flex flex-col items-center gap-1">
                <i class="fa-solid fa-house"></i><span class="text-[10px]" data-i18n="nav_home">首頁</span>
            </button>
            <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-bag-shopping"></i><span class="text-[10px]" data-i18n="nav_shop">商城</span>
            </button>
            <div class="relative -top-4">
                <button onclick="openUploadModal()" class="bg-sexify text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl shadow-sexify/50 active:scale-90 transition">
                    <i class="fa-solid fa-plus text-2xl"></i>
                </button>
            </div>
            <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1 relative">
                <i class="fa-solid fa-comment-dots"></i><span class="text-[10px]" data-i18n="nav_msg">訊息</span>
                <div id="nav-msg-badge" class="hidden absolute top-0 right-2 w-2 h-2 bg-sexify rounded-full border-2 border-white"></div>
            </button>
            <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1">
                <i class="fa-solid fa-user"></i><span class="text-[10px]" data-i18n="nav_me">我</span>
            </button>
        </nav>
    </div>

    <div id="upload-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeUploadModal()"></div>
        <div id="upload-panel" class="absolute bottom-0 w-full bg-white rounded-t-[40px] p-8 transition-transform duration-500 translate-y-full max-h-[90vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h2 class="text-2xl font-black mb-6 text-center">分享精彩時刻</h2>
            <div class="space-y-6">
                <div id="media-preview-container" class="relative bg-gray-50 rounded-3xl aspect-square flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-200 group active:border-sexify transition">
                    <div id="media-placeholder" class="text-center text-gray-400">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl mb-2"></i>
                        <p class="text-xs font-bold">點擊上傳相片或影片</p>
                    </div>
                    <img id="media-preview" class="hidden w-full h-full object-cover">
                    <video id="video-preview" class="hidden w-full h-full object-cover" controls></video>
                    <input type="file" id="media-input" accept="image/*,video/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
                </div>
                <textarea id="post-caption" placeholder="寫點什麼吧..." class="w-full bg-gray-50 rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-sexify/20 h-24 resize-none"></textarea>
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                        <span class="text-sm font-bold">付費內容</span>
                    </div>
                    <input type="checkbox" id="is-paid" class="w-6 h-6 accent-sexify">
                </div>
                <div id="price-input-container" class="hidden animate-in fade-in slide-in-from-top-2">
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">設定價格 (USD)</p>
                    <input type="number" id="post-price" placeholder="例如: 9.99" class="w-full bg-gray-50 rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-sexify/20">
                </div>
                <button onclick="handlePublish()" class="w-full bg-sexify text-white py-5 rounded-2xl font-black shadow-xl shadow-sexify/30 active:scale-95 transition">立即發佈</button>
            </div>
        </div>
    </div>

    <div id="post-detail-modal" class="fixed inset-0 z-[150] hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="closePostDetail()"></div>
        <div class="absolute inset-0 flex flex-col md:flex-row max-w-6xl mx-auto pointer-events-none">
            <div class="flex-1 flex items-center justify-center p-4 pointer-events-auto">
                <div id="detail-media-container" class="relative w-full max-h-[80vh] flex items-center justify-center rounded-2xl overflow-hidden shadow-2xl"></div>
            </div>
            <div class="w-full md:w-[400px] bg-white pointer-events-auto flex flex-col h-full md:h-auto rounded-t-[30px] md:rounded-none">
                <div class="p-4 border-b flex items-center justify-between sticky top-0 bg-white z-10">
                    <div class="flex items-center gap-3">
                        <img id="detail-avatar" class="w-10 h-10 rounded-full object-cover border">
                        <div>
                            <div id="detail-display-name" class="font-bold text-sm">---</div>
                            <div id="detail-username" class="text-gray-400 text-[10px]">@---</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="togglePostOptionsMenu()" class="w-8 h-8 flex items-center justify-center text-gray-400"><i class="fa-solid fa-ellipsis"></i></button>
                        <button onclick="closePostDetail()" class="w-8 h-8 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-4">
                    <p id="detail-caption" class="text-sm leading-relaxed text-gray-700"></p>
                    <div class="flex items-center gap-6 py-2 border-y border-gray-50">
                        <button id="detail-like-btn" class="flex items-center gap-1.5 transition active:scale-125">
                            <i class="fa-solid fa-heart text-xl"></i>
                            <span id="detail-likes-count" class="text-xs font-bold">0</span>
                        </button>
                        <div class="flex items-center gap-1.5 text-gray-400">
                            <i class="fa-solid fa-comment text-xl"></i>
                            <span id="detail-comments-count" class="text-xs font-bold">0</span>
                        </div>
                        <button id="detail-share-btn" class="flex items-center gap-1.5 text-gray-400 active:scale-110 transition ml-auto">
                            <i class="fa-solid fa-share-nodes text-xl"></i>
                        </button>
                    </div>
                    <div id="comments-container" class="space-y-4"></div>
                </div>
                <div class="p-4 bg-gray-50 border-t flex items-center gap-3">
                    <input type="text" id="comment-input" placeholder="發表評論..." class="flex-1 bg-white rounded-full px-5 py-2.5 text-sm outline-none border border-gray-200">
                    <button onclick="submitComment()" class="text-sexify font-bold px-2 active:scale-90 transition">發佈</button>
                </div>
            </div>
        </div>
    </div>

    <div id="share-modal" class="fixed inset-0 z-[200] hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeShareModal()"></div>
        <div id="share-panel" class="absolute bottom-0 w-full bg-white rounded-t-[30px] p-6 transition-transform duration-300 translate-y-full">
            <h3 class="font-black text-center mb-6 text-lg">分享這則貼文</h3>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="copyPostLink()" class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-2xl active:scale-95 transition">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-link"></i></div>
                    <span class="text-xs font-bold">複製連結</span>
                </button>
                <button onclick="shareToChatList()" class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-2xl active:scale-95 transition">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl"><i class="fa-solid fa-paper-plane"></i></div>
                    <span class="text-xs font-bold">發送給好友</span>
                </button>
            </div>
            <button onclick="closeShareModal()" class="w-full mt-6 py-4 font-bold text-gray-400">取消</button>
        </div>
    </div>

    <div id="edit-profile-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeEditProfile()"></div>
        <div class="absolute bottom-0 w-full bg-white rounded-t-[40px] p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black mb-8 text-center">編輯個人資料</h2>
            <div class="space-y-6">
                <div class="flex flex-col items-center">
                    <div class="relative group">
                        <img id="edit-avatar-preview" src=\"\" class="w-24 h-24 rounded-full object-cover border-4 border-gray-100">
                        <label class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-full opacity-0 group-hover:opacity-100 cursor-pointer transition">
                            <i class="fa-solid fa-camera text-white text-xl"></i>
                            <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="previewImage(this, 'edit-avatar-preview')">
                        </label>
                    </div>
                    <p class="mt-2 text-[10px] font-black text-gray-400 uppercase tracking-widest">點擊更換頭像</p>
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">顯示名稱</label>
                    <input type="text" id="edit-display-name" class="w-full bg-gray-50 rounded-2xl p-4 mt-1 outline-none focus:ring-2 ring-sexify/20 font-bold">
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">個人簡介</label>
                    <textarea id="edit-bio" class="w-full bg-gray-50 rounded-2xl p-4 mt-1 h-32 outline-none focus:ring-2 ring-sexify/20 text-sm leading-relaxed"></textarea>
                </div>
                <button onclick="saveProfile()" class="w-full bg-gray-900 text-white py-5 rounded-2xl font-black shadow-xl active:scale-95 transition">儲存變更</button>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 z-[200] hidden bg-white flex flex-col transition-transform duration-300 translate-x-full">
        <header class="p-4 border-b flex items-center gap-4 bg-white/80 backdrop-blur-md sticky top-0 z-10">
            <button onclick="closeChat()" class="p-2"><i class="fa-solid fa-chevron-left text-xl"></i></button>
            <div class="flex items-center gap-3">
                <img id="chat-target-avatar" src=\"\" class="w-10 h-10 rounded-full object-cover border">
                <div>
                    <div id="chat-target-name" class="font-bold text-sm">---</div>
                    <div id="chat-status" class="text-[10px] text-green-500 font-bold">在線上</div>
                </div>
            </div>
        </header>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col-reverse gap-4 bg-gray-50"></div>
        <div class="p-4 border-t bg-white pb-safe">
            <div id="typing-indicator" class="hidden text-[10px] text-gray-400 mb-2 ml-2 italic">正在輸入...</div>
            <div class="flex items-center gap-2">
                <button id="voice-btn" onclick="typeof toggleVoiceRecord === 'function' && toggleVoiceRecord()" class="text-gray-400 p-2 active:scale-90 transition"><i class="fa-solid fa-microphone text-xl"></i></button>
                <input type="file" id="chat-image-input" accept="image/*,video/*" class="hidden" onchange="typeof handleImageSelection === 'function' && handleImageSelection(this)">
                <button onclick="document.getElementById('chat-image-input').click()" class="text-gray-400 p-2"><i class="fa-solid fa-image text-xl"></i></button>
                <div class="flex-1 bg-gray-100 rounded-2xl flex items-end px-4 py-2 min-h-[44px]">
                    <input type="text" id="chat-input" placeholder="發送訊息..." class="bg-transparent border-none outline-none w-full text-sm">
                </div>
                <button id="send-btn" onclick="typeof handleSendAction === 'function' && handleSendAction()" class="bg-sexify text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md active:scale-90 transition disabled:opacity-50"><i class="fa-solid fa-paper-plane text-sm"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
    <script src="js/shop.js"></script>

    <div id="auth-modal" class="fixed inset-0 z-[1000] hidden bg-black flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[40px] p-10 shadow-2xl">
            <h2 id="auth-title" class="text-4xl font-black mb-2 tracking-tighter text-center">SEXIFY</h2>
            <p id="auth-subtitle" class="text-gray-400 text-center mb-10 font-bold text-sm uppercase tracking-widest">登入以繼續探索</p>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="電子郵件" class="w-full bg-gray-50 rounded-2xl p-5 outline-none focus:ring-2 ring-sexify/20 font-bold">
                <input type="password" id="auth-password" placeholder="密碼" class="w-full bg-gray-50 rounded-2xl p-5 outline-none focus:ring-2 ring-sexify/20 font-bold">
                <div id="auth-register-only-fields" class="hidden animate-in fade-in slide-in-from-top-2">
                   <input type="text" id="auth-username" placeholder="用戶帳號 (e.g. sexify_user)" class="w-full bg-gray-50 rounded-2xl p-5 outline-none focus:ring-2 ring-sexify/20 font-bold mt-4">
                </div>
                <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white py-5 rounded-2xl font-black shadow-xl shadow-sexify/30 active:scale-95 transition mt-4">登入</button>
                <div class="text-center mt-6">
                    <span id="auth-switch-text" class="text-gray-400 text-sm font-bold">還沒有帳號嗎？</span>
                    <button id="auth-switch-btn" onclick="toggleAuthMode()" class="text-sexify font-black ml-1 text-sm underline decoration-2 underline-offset-4">立即註冊</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
