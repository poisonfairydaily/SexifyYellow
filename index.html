<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        /* 確保 Age Gate 隱藏時有平滑效果 */
        #age-gate { transition: opacity 0.5s ease; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-4">此空間包含成人內容</h1>
            <p class="text-gray-400 mb-8">進入即表示您確認已滿 18 歲，並願意觀看此類內容。</p>
            <button onclick="window.verifyAge()" class="bg-sexify text-white font-bold py-3 px-12 rounded-full text-lg shadow-[0_0_20px_rgba(255,36,66,0.4)] active:scale-95 transition">我已滿18歲，進入</button>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[400] flex flex-col justify-center px-6 hidden">
        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <h2 id="auth-title" class="text-3xl font-black mb-2 text-center">SEXIFY</h2>
            <p id="auth-subtitle" class="text-gray-500 text-center mb-6 text-sm">登入以繼續探索</p>
            
            <div class="space-y-4">
                <div id="auth-register-only-fields" class="hidden space-y-4">
                    <input type="text" id="auth-display-name" placeholder="顯示名稱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <input type="text" id="auth-username" placeholder="唯一帳號名" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <select id="auth-gender" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition text-gray-500">
                        <option value="Unspecified" disabled selected>選擇您的性別</option>
                        <option value="Male">男性</option><option value="Female">女性</option><option value="Other">其他</option>
                    </select>
                    <div>
                        <label class="text-xs text-gray-500 ml-1 mb-1 block">生日 (須滿18歲)</label>
                        <input type="date" id="auth-birthday" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    </div>
                </div>
                <input type="email" id="auth-email" placeholder="電子信箱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                <input type="password" id="auth-password" placeholder="密碼" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white font-bold py-3 rounded-xl shadow-lg shadow-sexify/30 active:scale-95 transition mt-2">登入</button>
            </div>
            <div class="mt-6 text-center text-sm">
                <span id="auth-switch-text" class="text-gray-500">還沒有帳號嗎？</span> 
                <button id="auth-switch-btn" onclick="toggleAuthMode()" class="text-sexify font-bold">立即註冊</button>
            </div>
        </div>
    </div>

    <div id="settings-drawer" class="fixed inset-0 z-[200] hidden bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleSettings()">
        <div id="settings-panel" class="absolute left-0 top-0 bottom-0 w-72 bg-white transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-black text-lg">設定與數據</h2>
                <button onclick="toggleSettings()" class="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="flex-1 overflow-y-auto py-4">
                <div class="px-6 space-y-2">
                    <button onclick="openPersonalCenter()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition"><i class="fa-solid fa-id-card text-blue-600"></i><span>個人中心</span></button>
                    <button onclick="openFansSubsModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition"><i class="fa-solid fa-heart text-pink-600"></i><span>粉絲與訂閱</span></button>
                    <button onclick="openBookmarksModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition"><i class="fa-solid fa-bookmark text-yellow-600"></i><span>我的收藏</span></button>
                    <button onclick="toggleMyOrders()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition"><i class="fa-solid fa-bag-shopping text-purple-600"></i><span>訂單記錄</span></button>
                    <button id="logout-btn" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-red-50 text-red-600 transition"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>登出</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-500 h-screen overflow-hidden flex flex-col relative">
        <header class="bg-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm border-b">
            <button onclick="toggleSettings()" class="text-gray-700 w-8"><i class="fa-solid fa-bars text-xl"></i></button>
            <h1 class="text-2xl font-black italic tracking-tighter text-sexify flex-1 text-center">SEXIFY</h1>
            <div class="flex gap-4 items-center w-8 justify-end">
                <button onclick="toggleNotifications()" class="text-gray-700 relative"><i class="fa-regular fa-bell text-xl"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-24 relative">
            <div id="home-tab" class="tab-content block">
                <div class="px-4 py-3 flex gap-3 overflow-x-auto border-b bg-white sticky top-0 z-40 hide-scrollbar shadow-sm">
                    <button class="bg-black text-white px-5 py-1.5 rounded-full text-sm font-bold">為你推薦</button>
                    <button class="bg-gray-100 text-gray-600 px-5 py-1.5 rounded-full text-sm font-bold">追蹤中</button>
                </div>
                <div id="discovery-grid" class="p-2 bg-gray-100 grid grid-cols-2 gap-2"></div>
            </div>

            <div id="shop-tab" class="tab-content hidden h-full bg-gray-50 p-4 overflow-y-auto">
                <div class="bg-[#1a1a1a] text-white rounded-2xl p-5 mb-6 shadow-xl relative overflow-hidden">
                    <div class="relative z-10 flex items-center justify-between gap-2">
                        <div class="flex-1 min-w-0 pr-2">
                            <h2 class="text-xl font-black mb-0.5 italic truncate">SEXIFY 商城</h2>
                            <p class="text-[10px] text-gray-400 opacity-90 truncate">解鎖專屬圖集與私密互動</p>
                        </div>
                        <div class="flex-shrink-0 flex items-center gap-1.5">
                            <div class="flex flex-col items-end mr-1">
                                <span class="text-[8px] text-gray-500 uppercase tracking-tighter mb-0.5">我的餘額</span>
                                <span class="text-sm font-black text-sexify leading-none">🪙 <span id="user-balance">--</span></span>
                            </div>
                            <button onclick="window.toggleRechargeArea()" class="bg-sexify text-white w-8 h-8 flex items-center justify-center rounded-full shadow-lg active:scale-90 transition"><i id="recharge-icon" class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                    <div id="recharge-drawer" style="display: none;" class="mt-5 pt-4 border-t border-white/10">
                        <p class="text-[11px] text-gray-400 mb-2">請輸入美金 (最低 $20 USD)</p>
                        <div class="flex items-center gap-3">
                            <input type="number" id="rechargeAmount" value="20" class="w-full bg-white/10 border border-white/20 rounded-xl py-2 px-3 text-sm text-white">
                            <button onclick="payNow()" class="bg-white text-black font-black px-4 py-2 rounded-xl text-xs">儲值</button>
                        </div>
                    </div>
                </div>
                <div id="shop-grid" class="grid grid-cols-2 gap-4 pb-32"></div>
            </div>

            <div id="messages-tab" class="tab-content hidden h-full bg-white flex flex-col">
                <div class="p-4 border-b">
                    <div class="bg-gray-100 rounded-xl flex items-center px-4 py-2.5">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                        <input type="text" placeholder="在收件匣中搜尋..." class="bg-transparent border-none outline-none w-full text-sm">
                    </div>
                </div>
                <div id="chat-list" class="flex-1 overflow-y-auto"></div>
            </div>

            <div id="profile-tab" class="tab-content hidden h-full bg-gray-50">
                <div id="my-profile-container"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t shadow-sm z-50 h-[68px]">
            <div class="flex justify-around items-center h-full px-4">
                <button onclick="switchTab('home-tab', this)" class="text-sexify flex flex-col items-center"><i class="fa-solid fa-house text-xl mb-1"></i><span class="text-[10px] font-bold">首頁</span></button>
                <button onclick="switchTab('shop-tab', this)" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-store text-xl mb-1"></i><span class="text-[10px] font-bold">商城</span></button>
                <button class="w-12 h-12 bg-sexify text-white rounded-full flex justify-center items-center shadow-lg active:scale-95 transition -mt-6 border-4 border-white"><i class="fa-solid fa-plus text-xl"></i></button>
                <button onclick="switchTab('messages-tab', this)" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-comment-dots text-xl mb-1"></i><span class="text-[10px] font-bold">訊息</span></button>
                <button onclick="switchTab('profile-tab', this)" class="text-gray-400 flex flex-col items-center"><i class="fa-regular fa-user text-xl mb-1"></i><span class="text-[10px] font-bold">我</span></button>
            </div>
        </nav>
    </div>

    <div id="my-orders-view" class="hidden fixed inset-0 z-[5500] bg-black flex flex-col">
        <div class="p-6 flex items-center gap-4 border-b border-white/10 bg-black">
            <button onclick="toggleMyOrders()" class="text-white text-xl"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 class="text-white text-lg font-bold">訂單記錄</h2>
        </div>
        <div id="orders-list-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-black"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/main.js"></script>

    <script>
        // 解鎖 18 歲介面
        window.verifyAge = function() {
            const ageGate = document.getElementById('age-gate');
            const appContent = document.getElementById('app-content');
            
            if (ageGate) {
                ageGate.style.opacity = '0'; // 漸隱動畫
                setTimeout(() => {
                    ageGate.style.display = 'none'; // 徹底關閉
                }, 500);
            }
            
            if (appContent) {
                // 移除模糊和禁止點擊的樣式
                appContent.classList.remove('blur-2xl', 'pointer-events-none');
            }
            console.log("已成功進入網站，模糊已解除。");
        };

        // 簡單的分頁切換 (確保基礎功能運作)
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.add('text-gray-400'));
            el.classList.remove('text-gray-400');
            el.classList.add('text-sexify');
            if(tabId === 'shop-tab' && typeof window.renderShop === 'function') {
                window.renderShop();
                window.refreshBalanceUI();
            }
        }
    </script>
</body>
</html>
