<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://static.cloudflareinsights.com; img-src * 'self' data: blob: https://*.supabase.co https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.workers.dev https://sexify-uploader.poisonfairydaily.workers.dev https://static.cloudflareinsights.com data: blob:;">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .tab-content { transition: opacity 0.3s ease; }
        /* 避免 iOS 輸入框縮放 */
        input, textarea { font-size: 16px !important; }
        .bg-sexify { background-color: #ff2442; }
        .text-sexify { color: #ff2442; }
        /* 彈窗滑入動畫 */
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* 頭像編輯器防止手機預設滑動干擾 */
        #avatar-editor-container {
            touch-action: none;
            user-select: none;
            cursor: move;
        }

        /* ✨ 終極殺手鐧：強制小紅書風格完美正圓頭像，無視任何外層 Flex 擠壓 */
        .xhs-avatar {
            width: 22px !important;
            height: 22px !important;
            min-width: 22px !important;
            min-height: 22px !important;
            max-width: 22px !important;
            max-height: 22px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            flex-shrink: 0 !important;
            border: 1px solid #f3f4f6 !important;
            background-color: #f9fafb !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // ✨ 修改為最穩定的權限監聽器，防止死循環
        document.addEventListener('DOMContentLoaded', () => {
            if (window.supabaseClient) {
                window.supabaseClient.auth.onAuthStateChange((event, session) => {
                    // 如果被登出，或是初始檢查沒有 Session，就跳轉去登入頁
                    if (event === 'SIGNED_OUT' || (!session && event === 'INITIAL_SESSION')) {
                        window.location.replace('login.html');
                    } else if (session) {
                        // We no longer store userId in localStorage to avoid data exposure
                    }
                });
            }
        });
    </script>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="search-overlay" class="fixed inset-0 z-[1000] bg-white hidden flex-col transform transition-transform duration-300 translate-y-full">
        <div class="p-4 border-b flex items-center gap-3">
            <div class="flex-1 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="搜尋用戶或內容..." class="w-full bg-gray-100 rounded-full py-2 pl-10 pr-4 outline-none text-sm focus:ring-2 focus:ring-sexify">
            </div>
            <button onclick="toggleSearch(false)" class="text-gray-600 font-bold text-sm whitespace-nowrap">取消</button>
        </div>
        <div id="searchResults" class="flex-1 overflow-y-auto p-4 bg-gray-50">
            <div class="text-center text-gray-400 mt-10 text-sm">請在上方輸入關鍵字開始搜尋...</div>
        </div>
    </div>

    <div id="notification-drawer" class="fixed inset-0 z-[800] hidden bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleNotifications()">
        <div id="notification-panel" class="absolute right-0 top-0 bottom-0 w-80 bg-white transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="p-4 border-b flex justify-between items-center bg-gray-50">
                <button onclick="toggleNotifications()" class="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600"><i class="fa-solid fa-chevron-right"></i></button>
                <h2 class="font-black text-lg text-gray-900">通知</h2>
                <div class="w-8"></div>
            </header>
            <div id="notification-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50 custom-scrollbar">
                </div>
        </div>
    </div>

    <div id="settings-drawer" class="fixed inset-0 z-[800] hidden bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleSettings()">
        <div id="settings-panel" class="absolute left-0 top-0 bottom-0 w-72 bg-white transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <header class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-black text-lg text-gray-900" data-i18n="settings">設定與數據</h2>
                <button onclick="toggleSettings()" class="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </header>

            <div class="p-5 border-b bg-white flex items-center gap-4">
                <img id="sidebar-avatar" src="https://ui-avatars.com/api/?name=User" class="w-14 h-14 rounded-full object-cover shadow-sm border border-gray-100">
                <div class="flex-1 overflow-hidden">
                    <h3 id="sidebar-name" class="font-black text-lg truncate">載入中...</h3>
                    <p class="text-xs text-gray-500 font-bold mt-0.5 truncate">@<span id="sidebar-username">...</span></p>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto py-4 space-y-2 px-4">
                <button onclick="openPersonalCenter()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-id-card"></i></div>
                    <span class="font-bold text-gray-700" data-i18n="menu_personal">個人中心</span>
                </button>
                <button onclick="openBookmarksModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center"><i class="fa-solid fa-bookmark"></i></div>
                    <span class="font-bold text-gray-700" data-i18n="menu_bookmarks">我的收藏</span>
                </button>
                <button onclick="openOrdersModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-bag-shopping"></i></div>
                    <span class="font-bold text-gray-700" data-i18n="menu_orders">訂單記錄</span>
                </button>
                <button onclick="toggleLanguage()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i class="fa-solid fa-language"></i></div>
                    <span class="font-bold text-gray-700" data-i18n="menu_lang">切換語言 (EN/ZH)</span>
                </button>
                <button onclick="openContactModal()" class="w-full flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition active:scale-95">
                    <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center"><i class="fa-solid fa-headset"></i></div>
                    <span class="font-bold text-gray-700" data-i18n="menu_contact">聯絡我們</span>
                </button>
            </div>
            <div class="p-6 border-t bg-gray-50">
                <button onclick="logoutUser()" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-200 text-gray-700 font-bold py-3.5 rounded-2xl active:scale-95 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i><span data-i18n="menu_logout">登出帳號</span>
                </button>
            </div>
        </div>
    </div>

    <div id="bookmarks-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm flex-col transform translate-y-full transition-transform duration-300">
        <div class="bg-white flex-1 mt-20 rounded-t-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
            <header class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 class="font-black text-xl" data-i18n="menu_bookmarks">我的收藏</h2>
                <button onclick="closeBookmarksModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div id="bookmarks-list" class="flex-1 overflow-y-auto p-4 masonry-grid bg-gray-50"></div>
        </div>
    </div>

    <div id="orders-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm flex-col transform translate-y-full transition-transform duration-300">
        <div class="bg-white flex-1 mt-20 rounded-t-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
            <header class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 class="font-black text-xl" data-i18n="menu_orders">訂單記錄</h2>
                <button onclick="closeOrdersModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div id="orders-list" class="flex-1 overflow-y-auto p-4 bg-gray-50 text-center text-gray-400 py-20 font-bold">暫無訂單記錄</div>
        </div>
    </div>

    <div id="contact-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm flex-col transform translate-y-full transition-transform duration-300">
        <div class="bg-white flex-1 mt-20 rounded-t-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
            <header class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 class="font-black text-xl" data-i18n="menu_contact">聯絡我們</h2>
                <button onclick="closeContactModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="flex-1 overflow-y-auto p-6 bg-gray-50 flex flex-col items-center pt-10">
                <i class="fa-solid fa-paper-plane text-5xl text-gray-300 mb-4"></i>
                <p class="text-sm text-gray-600 mb-8 text-center font-bold">有任何問題或合作提案，歡迎與我們聯繫：</p>
                <a href="mailto:support@sexify.com" class="block w-full max-w-xs bg-sexify text-white text-center font-bold py-4 rounded-2xl active:scale-95 transition shadow-lg">寄送電子郵件</a>
            </div>
        </div>
    </div>

    <div id="other-profile-modal" class="fixed inset-0 bg-white z-[850] hidden flex-col transform translate-x-full transition-transform duration-300">
        <header class="bg-white/90 backdrop-blur-md border-b flex items-center p-4 sticky top-0 z-10 justify-between">
            <div class="flex items-center gap-2">
                <button onclick="closeOtherProfile()" class="text-gray-700 w-8 h-8 flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <h2 id="other-header-name" class="font-black text-lg">載入中...</h2>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto bg-gray-100">
            <div class="bg-white pb-4 shadow-sm relative">
                <img id="other-banner" src="" class="w-full h-40 object-cover hidden">
                <div class="px-5 relative -mt-12">
                    <div class="flex justify-between items-end mb-3">
                        <img id="other-avatar" src="" class="w-24 h-24 rounded-full border-4 border-white object-cover bg-white shadow-sm">
                        <div class="flex gap-2 mb-2">
                            <button id="other-msg-btn" class="bg-gray-100 text-gray-700 w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold active:scale-95 transition shadow-sm"><i class="fa-solid fa-comment-dots"></i></button>
                            <button id="other-follow-btn" class="bg-sexify text-white px-6 py-2 rounded-full text-xs font-bold active:scale-95 transition shadow-sm">追蹤</button>
                        </div>
                    </div>
                    <div>
                        <h2 id="other-display-name" class="text-xl font-black text-gray-900">載入中...</h2>
                        <p id="other-username" class="text-xs text-sexify font-bold mt-0.5 mb-2">@...</p>
                        <p id="other-bio" class="text-sm text-gray-600 whitespace-pre-line">...</p>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 pt-3 pb-32 min-h-[300px]">
                <div id="other-posts-grid" class="masonry-grid px-2"></div>
            </div>
        </div>
    </div>

    <div id="post-detail-modal" class="fixed inset-0 bg-white z-[850] hidden flex-col transform translate-x-full transition-transform duration-300">
        <header class="bg-white/90 backdrop-blur-md border-b flex items-center p-4 sticky top-0 z-10 justify-between">
            <div class="flex items-center gap-2">
                <button onclick="closePostDetail()" class="text-gray-700 w-8 h-8 flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <h2 class="font-black text-lg" data-i18n="post_detail">貼文詳情</h2>
            </div>
            <div class="relative">
                <button onclick="document.getElementById('post-options-menu').classList.toggle('hidden'); event.stopPropagation();"><i class="fa-solid fa-ellipsis-vertical text-xl"></i></button>
                <div id="post-options-menu" class="hidden absolute right-0 top-full mt-2 w-32 bg-white rounded-xl shadow-lg border z-50 overflow-hidden"></div>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto pb-20 bg-gray-100" onclick="document.getElementById('post-options-menu').classList.add('hidden')">
            <div id="post-detail-content" class="bg-white pb-4 mb-2 shadow-sm"></div>
            <div class="px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest" data-i18n="comments">留言區</div>
            <div id="post-comments-list" class="bg-white p-4 space-y-4"></div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-white z-[999] hidden flex flex-col transform translate-x-full transition-transform duration-300">
        <header class="bg-white border-b flex items-center justify-between p-4 sticky top-0 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <button onclick="window.closeChat()" class="text-gray-700 w-8 h-8 flex items-center justify-center active:scale-90 transition">
                    <i class="fa-solid fa-chevron-left text-xl"></i>
                </button>
                <div class="flex items-center gap-3">
                    <img id="chat-target-avatar" src=""
                         class="w-10 h-10 rounded-full object-cover bg-gray-100 border border-gray-100"
                         onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'">
                    <div class="flex flex-col">
                        <h2 id="chat-name" class="font-black text-lg leading-none text-gray-900">載入中...</h2>
                        <span id="chat-status" class="text-[10px] text-green-500 font-bold mt-1 uppercase tracking-tighter">● Online</span>
                    </div>
                </div>
            </div>
            <button id="group-options-btn" onclick="window.openGroupSettings()" class="hidden text-gray-700 w-8 h-8 flex items-center justify-center active:scale-90 transition">
                <i class="fa-solid fa-ellipsis-vertical text-xl"></i>
            </button>
        </header>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 flex flex-col custom-scrollbar"></div>
        <div class="p-4 bg-white border-t flex flex-col gap-2 safe-area-bottom">
            <div class="flex items-center gap-2">
                <button onclick="window.toggleVoiceRecord()" class="w-10 h-10 text-gray-400 active:scale-90"><i class="fa-solid fa-microphone text-xl"></i></button>
                <label class="w-10 h-10 flex items-center justify-center text-gray-400 cursor-pointer active:scale-90">
                    <i class="fa-solid fa-image text-xl"></i>
                    <input type="file" accept="image/*,video/*" class="hidden" onchange="window.handleImageSelection(this)">
                </label>
                <input type="text" id="chat-input" placeholder="輸入訊息..." class="flex-1 bg-gray-100 rounded-full px-4 py-3 text-sm outline-none">
                <button id="send-btn" onclick="window.handleSendAction()" class="bg-sexify text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="create-group-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm items-center justify-center p-4">
       <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl animate-fade-in">
           <h3 class="font-black text-lg mb-4 text-center">建立新群組</h3>
           <input type="text" id="new-group-name" placeholder="請輸入群組名稱..." class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-sexify outline-none mb-4">
           <input type="text" id="new-group-members-input" placeholder="輸入想邀請的用戶名稱 (多位請用逗號 , 分隔)" class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-sexify outline-none mb-4">
           <button onclick="window.handleCreateGroup()" class="w-full bg-sexify text-white font-black py-4 rounded-2xl active:scale-95 transition shadow-lg">建立</button>
           <button onclick="window.closeCreateGroupModal()" class="w-full mt-3 text-gray-500 font-bold py-2 active:scale-95 transition">取消</button>
       </div>
    </div>

    <div id="group-settings-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm flex-col transform translate-y-full transition-transform duration-300">
       <div class="bg-white flex-1 mt-20 rounded-t-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
           <header class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
               <h2 class="font-black text-xl">群組成員</h2>
               <button onclick="window.closeGroupSettings()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 active:scale-90 transition"><i class="fa-solid fa-xmark"></i></button>
           </header>
           <div class="p-4 border-b flex gap-2 bg-white">
               <input type="text" id="group-add-user-input" placeholder="輸入用戶的顯示名稱或 Username" class="flex-1 bg-gray-50 rounded-xl p-3 outline-none text-sm focus:ring-2 focus:ring-sexify">
               <button onclick="window.addGroupMember()" class="bg-black text-white px-5 rounded-xl font-bold text-sm active:scale-95 transition">邀請</button>
           </div>
           <div id="group-members-list" class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-2"></div>
       </div>
    </div>

    <div id="upload-modal" class="fixed inset-0 z-[800] hidden bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeUploadModal()">
        <div id="upload-panel" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-8 transform translate-y-full transition-transform duration-300 flex flex-col" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full self-center mb-6"></div>
            <h2 class="text-2xl font-black mb-6 text-gray-900">分享你的動態</h2>
            <div class="space-y-4">
                <div id="media-preview-container" class="relative bg-gray-50 rounded-2xl h-48 flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-200">
                    <div id="media-placeholder" class="text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-300 mb-2"></i>
                        <p class="text-xs text-gray-400">點擊上傳媒體 (支援 R2)</p>
                    </div>
                    <img id="media-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                    <video id="video-preview" class="absolute inset-0 w-full h-full object-cover hidden" muted loop playsinline></video>
                    <input type="file" id="file-input" onchange="handleFileSelect(event)" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <textarea id="post-caption" placeholder="寫點什麼..." class="w-full bg-gray-50 rounded-2xl p-4 text-sm outline-none h-24 resize-none"></textarea>
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl">
                    <span class="text-sm font-bold text-gray-700">設為收費內容</span>
                    <input type="checkbox" id="view-paid" class="w-5 h-5 accent-sexify">
                </div>
                <div id="price-container" class="flex items-center gap-3 bg-gray-50 p-4 rounded-2xl">
                    <span class="text-sm font-bold text-gray-700">價格 (🪙)</span>
                    <input type="number" id="post-price" placeholder="0" class="bg-transparent border-none outline-none w-full text-right font-black text-sexify">
                </div>
                <button onclick="publishPost()" class="w-full bg-sexify text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition">發佈內容</button>
            </div>
        </div>
    </div>

    <div id="edit-profile-modal" class="fixed inset-0 z-[1100] hidden bg-black/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl animate-fade-in">
            <div class="p-6 border-b border-gray-50 flex justify-between items-center">
                <h3 class="font-black text-lg" data-i18n="edit_profile">編輯個人資料</h3>
                <button onclick="closeEditProfile()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">

                <div class="flex flex-col items-center mb-6">
                    <div id="avatar-editor-container" class="relative w-48 h-48 rounded-full border-4 border-white shadow-xl bg-gray-100 overflow-hidden group">
                        <canvas id="avatar-canvas" class="w-full h-full"></canvas>

                        <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition flex items-center justify-center pointer-events-none">
                            <i class="fa-solid fa-camera text-white text-xl"></i>
                        </div>

                    <div class="mt-4 flex gap-4">

    <script>
        // 商城儲值開關
        window.toggleRechargeArea = function() {
            const drawer = document.getElementById('recharge-drawer');
            if (drawer) {
                const isHidden = drawer.style.display === 'none' || drawer.style.display === '';
                drawer.style.display = isHidden ? 'block' : 'none';
            }
        };

        // 關閉聊天室
        window.closeChat = function() {
            window.activeRoomId = null;
            window.activeIsGroup = false;
            const modal = document.getElementById('chat-modal');
            if (modal) {
                modal.classList.add('translate-x-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        };

        // 側邊欄自動抓取用戶資料邏輯
        window.loadSidebarProfile = async function() {
            try {
                if (!window.supabaseClient) return;
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (!user) return;

                const { data: profile } = await window.supabaseClient.from('profiles').select('display_name, username, avatar_url').eq('id', user.id).single();
                if (profile) {
                    const avatar = document.getElementById('sidebar-avatar');
                    const name = document.getElementById('sidebar-name');
                    const username = document.getElementById('sidebar-username');

                    if (avatar) avatar.src = profile.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.display_name)}`;
                    if (name) name.innerText = profile.display_name || '未命名用戶';
                    if (username) username.innerText = profile.username || 'unknown';
                }
            } catch (e) {
                console.error('Sidebar Profile Load Error:', e);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (window.refreshBalanceUI) window.refreshBalanceUI();
            window.loadSidebarProfile(); // 初始載入一次
        });
    </script>
