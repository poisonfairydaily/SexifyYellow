<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; img-src * 'self' data: blob: https://*.supabase.co https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; display: none; flex-direction: column;
        }
        .search-overlay.active { display: flex; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-4">此空間包含成人內容</h1>
            <p class="text-gray-400 mb-8">進入即表示您確認已滿 18 歲，並願意觀看此類內容。</p>
            <button onclick="verifyAge()" class="bg-sexify text-white font-bold py-3 px-12 rounded-full text-lg shadow-[0_0_20px_rgba(255,36,66,0.4)] active:scale-95 transition">我已滿18歲，進入</button>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[400] flex flex-col justify-center px-6 hidden">
        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <h2 id="auth-title" class="text-3xl font-black mb-2 text-center">SEXIFY</h2>
            <p id="auth-subtitle" class="text-gray-500 text-center mb-6 text-sm">登入以繼續探索</p>
            
            <div class="space-y-4">
                <div id="auth-register-only-fields" class="hidden space-y-4">
                    <input type="text" id="auth-display-name" placeholder="顯示名稱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <input type="text" id="auth-username" placeholder="帳號名" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                    <select id="auth-gender" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 outline-none">
                        <option value="Unspecified" disabled selected>選擇您的性別</option>
                        <option value="Male">男性</option><option value="Female">女性</option><option value="Other">其他</option>
                    </select>
                    <input type="date" id="auth-birthday" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none">
                    <div class="flex items-start gap-2">
                        <input type="checkbox" id="auth-tos" class="mt-1 accent-sexify">
                        <label for="auth-tos" class="text-xs text-gray-500 leading-tight">我同意服務條款，並聲明我已年滿 18 歲。</label>
                    </div>
                </div>

                <input type="email" id="auth-email" placeholder="電子信箱" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                <input type="password" id="auth-password" placeholder="密碼 (至少6位數)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-sexify transition">
                
                <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition mt-2">登入</button>
            </div>
            
            <div class="mt-6 text-center text-sm">
                <span id="auth-switch-text" class="text-gray-500">還沒有帳號嗎？</span> 
                <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-sexify font-bold">立即註冊</button>
            </div>

            <div class="flex justify-end mt-4 px-2">
                <button type="button" onclick="toggleForgotModal(true)" class="text-[11px] text-gray-400 hover:text-sexify font-medium">忘記密碼？</button>
            </div>
        </div>
    </div>

    <div id="forgot-password-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9999] hidden items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl relative animate-fade-in">
            <button onclick="toggleForgotModal(false)" class="absolute top-6 right-6 text-gray-400 hover:text-black">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-2xl font-black text-gray-900 mb-2">找回密碼</h2>
            <div class="space-y-5 mt-4">
                <input type="email" id="modal-reset-email" placeholder="輸入註冊信箱" class="w-full p-4 bg-gray-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-black outline-none transition-all">
                <button onclick="handleModalResetRequest()" id="modal-reset-btn" class="w-full bg-black text-white p-4 rounded-2xl font-bold text-sm active:scale-95">發送重設郵件</button>
                <p id="modal-message" class="text-center text-[11px] font-medium min-h-[1rem]"></p>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-white z-[300] hidden transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="bg-white/90 backdrop-blur-md border-b flex items-center p-4 sticky top-0 z-10 shadow-sm">
            <button onclick="closeChat()" class="text-gray-700 w-10 h-10 flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
            <div class="flex items-center gap-3 ml-2 flex-1">
                <img id="chat-target-avatar" src="" class="w-10 h-10 rounded-full object-cover">
                <span id="chat-name" class="font-bold text-gray-900 leading-tight">載入中...</span>
            </div>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 bg-gray-50 flex flex-col-reverse"></div>
        <div class="p-3 bg-white border-t flex items-center gap-2">
            <input type="text" id="chat-input" placeholder="發送訊息..." class="flex-1 bg-gray-100 rounded-2xl px-4 py-2 text-sm outline-none">
            <button id="send-btn" class="bg-sexify text-white w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition"><i class="fa-solid fa-paper-plane text-sm"></i></button>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-500 h-screen overflow-hidden flex flex-col relative">
        <header class="bg-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm border-b">
            <button onclick="toggleSettings()" class="text-gray-700 w-8"><i class="fa-solid fa-bars text-xl"></i></button>
            <h1 class="text-2xl font-black italic tracking-tighter text-sexify flex-1 text-center">SEXIFY</h1>
            <div class="w-8 flex justify-end">
                <button onclick="toggleNotifications()" class="text-gray-700 relative"><i class="fa-regular fa-bell text-xl"></i><span id="notification-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-sexify rounded-full border border-white hidden"></span></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-24 relative">
            <div id="home-tab" class="tab-content block h-full">
                <div class="px-4 py-3 flex gap-3 overflow-x-auto border-b bg-white sticky top-0 z-40 hide-scrollbar shadow-sm">
                    <button class="bg-black text-white px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">為你推薦</button>
                    <button class="bg-gray-100 text-gray-600 px-5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">追蹤中</button>
                </div>
                <div id="discovery-grid" class="masonry-grid p-2 pb-20 bg-gray-100"></div>
            </div>

            <div id="shop-tab" class="tab-content hidden h-full bg-gray-50 p-4 overflow-y-auto">
                <div class="bg-[#1a1a1a] text-white rounded-2xl p-5 mb-6 shadow-xl relative overflow-hidden">
                    <div class="flex items-center justify-between relative z-10">
                        <div class="flex-1 truncate"><h2 class="text-xl font-black italic">SEXIFY 商城</h2></div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm font-black text-sexify leading-none">🪙 <span id="shop-balance-display">--</span></span>
                            <button onclick="window.toggleMyOrders()" class="bg-white/10 px-3 py-1 rounded-full text-[11px] font-bold border border-white/10">庫存</button>
                            <button onclick="window.toggleRechargeArea()" class="bg-sexify w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-plus text-sm"></i></button>
                        </div>
                    </div>
                    <div id="recharge-drawer" style="display: none;" class="mt-4 pt-4 border-t border-white/10">
                        <input type="number" id="rechargeAmount" value="20" class="w-full bg-white/10 border-none rounded-xl p-2.5 text-sm text-white focus:ring-1 focus:ring-sexify">
                        <button onclick="payNow()" class="w-full mt-2 bg-white text-black font-black py-2 rounded-xl text-sm">儲值</button>
                    </div>
                </div>
                <div id="shop-grid" class="grid grid-cols-2 gap-4 pb-32"></div>
            </div>

            <div id="messages-tab" class="tab-content hidden h-full bg-white flex-col">
                <div id="chat-list" class="flex-1 overflow-y-auto pb-20"></div>
            </div>

            <div id="profile-tab" class="tab-content hidden h-full bg-gray-50 pb-20"><div id="my-profile-container"></div></div>
        </main>

        <nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t shadow-md z-50 h-[68px]">
            <div class="flex justify-between items-center h-full px-4 relative">
                <button onclick="switchTab('home-tab', this)" class="nav-btn flex flex-col items-center flex-1"><i class="fa-solid fa-house mb-1 text-xl"></i><span class="text-[10px] font-bold">首頁</span></button>
                <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1 pr-6"><i class="fa-solid fa-store mb-1 text-xl"></i><span class="text-[10px] font-bold">商城</span></button>
                <div class="absolute left-1/2 -translate-x-1/2 -top-5 z-50">
                    <button onclick="openUploadModal()" class="w-14 h-14 bg-sexify text-white rounded-full flex justify-center items-center shadow-lg border-4 border-white"><i class="fa-solid fa-plus text-2xl font-black"></i></button>
                </div>
                <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1 pl-6 relative"><i class="fa-solid fa-comment-dots mb-1 text-xl"></i><span class="text-[10px] font-bold">訊息</span></button>
                <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center flex-1"><i class="fa-regular fa-user mb-1 text-xl"></i><span class="text-[10px] font-bold">我</span></button>
            </div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/create.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
