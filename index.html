<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { color: #FF2D55 !important; }
        .bg-sexify { background-color: #FF2D55; }
        .text-sexify { color: #FF2D55; }
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6">
        <div class="text-center">
            <h1 class="text-white text-3xl font-black mb-2 italic">Sexify</h1>
            <p class="text-gray-400 text-sm mb-8">您必須年滿 18 歲才能進入</p>
            <button onclick="acceptAge()" class="bg-sexify text-white px-10 py-4 rounded-full font-bold text-lg active:scale-95 transition">我已滿 18 歲</button>
        </div>
    </div>

    <div id="app-container" class="max-w-md mx-auto min-h-screen bg-white relative pb-20 shadow-xl">
        
        <main id="main-content">
            <div id="discover-view" class="page-view active">
                <div class="p-4 flex justify-between items-center sticky top-0 bg-white/80 backdrop-blur-md z-30">
                    <h1 class="text-2xl font-black italic text-sexify">Sexify</h1>
                    <button onclick="toggleSearch(true)" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-magnifying-glass text-gray-600"></i></button>
                </div>
                <div id="posts-container" class="px-2 pb-4"></div>
            </div>

            <div id="messages-view" class="page-view">
                <div class="p-4 sticky top-0 bg-white/80 backdrop-blur-md z-30 border-b">
                    <h1 class="text-xl font-bold">訊息</h1>
                </div>
                <div id="chat-list" class="divide-y divide-gray-50"></div>
            </div>

            <div id="profile-view" class="page-view">
                <div id="creator-header" class="relative">
                    <div class="h-48 bg-gray-200 relative overflow-hidden">
                        <img id="creator-banner" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="px-4 -mt-12 relative z-10">
                        <div class="flex items-end justify-between mb-4">
                            <img id="creator-avatar" src="" class="w-24 h-24 rounded-full border-4 border-white object-cover bg-white">
                            <button onclick="openEditModal()" class="bg-white border border-gray-300 px-4 py-1.5 rounded-full text-sm font-bold active:scale-95 transition">編輯個人檔案</button>
                        </div>
                        <h2 id="creator-display-name" class="text-2xl font-bold">載入中...</h2>
                        <p id="creator-username" class="text-gray-500 text-sm mb-3"></p>
                        <p id="creator-bio" class="text-gray-700 text-sm mb-4"></p>
                        <div class="flex gap-4 mb-6">
                            <div class="cursor-pointer"><span class="font-bold" id="fans-count">0</span> <span class="text-gray-500 text-sm">粉絲</span></div>
                            <div class="cursor-pointer"><span class="font-bold" id="subs-count">0</span> <span class="text-gray-500 text-sm">追蹤中</span></div>
                        </div>
                    </div>
                    <div id="creator-posts-grid" class="grid grid-cols-2 gap-2 px-2 pb-10"></div>
                </div>
                <div class="hidden"><span id="header-name"></span></div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-lg border-t flex justify-around items-center h-16 z-40">
            <button onclick="switchTab('discover-view', this)" class="nav-btn flex flex-col items-center gap-1 active-tab">
                <i class="fa-solid fa-compass text-xl"></i>
                <span class="text-[10px] font-medium">探索</span>
            </button>
            <button onclick="openCreateModal()" class="flex flex-col items-center -mt-8">
                <div class="w-12 h-12 bg-sexify rounded-2xl rotate-45 flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i class="fa-solid fa-plus text-white text-xl -rotate-45"></i>
                </div>
            </button>
            <button onclick="switchTab('messages-view', this)" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-message text-xl"></i>
                <span class="text-[10px] font-medium">訊息</span>
            </button>
            <button onclick="switchTab('profile-view', this)" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-user text-xl"></i>
                <span class="text-[10px] font-medium">我</span>
            </button>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/profile-view.js"></script>
    <script src="js/search.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/create.js"></script>

</body>
</html>
