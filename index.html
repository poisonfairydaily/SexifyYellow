<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chat-messages::-webkit-scrollbar { display: none; }
        .image-loading {
            background-image: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 37%, #f3f4f6 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[300] bg-black flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="max-w-sm w-full bg-white rounded-3xl p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-sexify/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-18 text-sexify text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-4">內容分級確認</h2>
            <p class="text-gray-500 mb-8 leading-relaxed">本平台包含成人導向內容。您必須年滿 18 歲才能進入。繼續瀏覽即代表您同意我們的服務條款。</p>
            <button onclick="verifyAge()" class="w-full bg-sexify text-white font-bold py-4 rounded-2xl shadow-lg shadow-sexify/20 active:scale-95 transition-transform">我已年滿 18 歲</button>
            <p class="mt-6 text-sm text-gray-400">未滿 18 歲？<a href="https://google.com" class="underline">離開此頁面</a></p>
        </div>
    </div>

    <div id="app-content" class="blur-2xl pointer-events-none transition-all duration-700">
        <header class="fixed top-0 left-0 right-0 h-16 bg-white/80 backdrop-blur-md border-b z-50 px-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div onclick="toggleSettings()" class="w-10 h-10 rounded-full bg-gray-200 overflow-hidden ring-2 ring-white cursor-pointer active:scale-90 transition">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full object-cover" alt="Me">
                </div>
                <h1 class="font-black text-2xl tracking-tighter text-sexify">SEXIFY</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 flex items-center justify-center text-xl text-gray-700 active:scale-90 transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </header>

        <main class="pt-16 pb-20 max-w-md mx-auto min-h-screen">
            <div id="discovery-tab" class="tab-content active">
                <div class="p-4 flex gap-4 overflow-x-auto no-scrollbar mb-2">
                    <div class="flex-shrink-0 text-center space-y-1">
                        <div class="w-16 h-16 rounded-full p-0.5 ring-2 ring-sexify">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full rounded-full object-cover">
                        </div>
                        <span class="text-[10px] font-medium">你的動態</span>
                    </div>
                </div>
                <div id="posts-grid" class="p-2 columns-2 gap-2 space-y-2"></div>
            </div>

            <div id="shop-tab" class="tab-content">
                <div class="p-4"><h2 class="text-xl font-bold mb-4">Sexify 商城</h2><div id="shop-items" class="space-y-4"></div></div>
            </div>

            <div id="messages-tab" class="tab-content">
                <div class="p-4 border-b flex justify-between items-center bg-white sticky top-16 z-10">
                    <h2 class="text-xl font-bold">訊息中心</h2>
                    <span class="text-xs bg-sexify text-white px-2 py-0.5 rounded-full" id="unread-count">3</span>
                </div>
                <div id="chat-list" class="divide-y divide-gray-50"></div>
            </div>

            <div id="profile-tab" class="tab-content">
                <div id="profile-header"></div>
                <div id="profile-posts" class="p-2 columns-3 gap-1 space-y-1 mt-1"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t z-50 flex justify-around items-center h-16 px-2">
            <button onclick="switchTab('discovery-tab', this)" class="nav-btn nav-active flex flex-col items-center gap-1 flex-1">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-[10px]">探索</span>
            </button>
            <button onclick="switchTab('shop-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1 flex-1">
                <i class="fa-solid fa-bag-shopping text-xl"></i>
                <span class="text-[10px]">商城</span>
            </button>
            <div class="flex-1 flex justify-center -mt-8">
                <button onclick="document.getElementById('create-modal').classList.remove('hidden')" class="w-14 h-14 bg-sexify text-white rounded-2xl shadow-lg shadow-sexify/30 flex items-center justify-center text-2xl active:scale-90 transition-transform ring-4 ring-white">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <button onclick="switchTab('messages-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1 flex-1">
                <div class="relative">
                    <i class="fa-solid fa-comment-dots text-xl"></i>
                    <div class="absolute -top-1 -right-1 w-2 h-2 bg-sexify rounded-full border border-white"></div>
                </div>
                <span class="text-[10px]">訊息</span>
            </button>
            <button onclick="switchTab('profile-tab', this)" class="nav-btn text-gray-400 flex flex-col items-center gap-1 flex-1">
                <i class="fa-solid fa-user text-xl"></i>
                <span class="text-[10px]">個人</span>
            </button>
        </nav>
    </div>

    <div id="settings-drawer" class="fixed inset-0 z-[100] hidden">
        <div onclick="toggleSettings()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div id="settings-panel" class="absolute top-0 left-0 bottom-0 w-4/5 max-w-xs bg-white shadow-2xl transition-transform duration-300 -translate-x-full flex flex-col">
            <div class="p-6 border-b">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-16 h-16 rounded-2xl bg-gray-100 overflow-hidden shadow-inner">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="font-bold text-lg">用戶設定</h3>
                        <p class="text-xs text-gray-400">ID: sexify_8829</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 p-3 rounded-xl text-center">
                        <span class="block font-black text-sexify text-lg">1,240</span>
                        <span class="text-[10px] text-gray-400">餘額 (S-Coin)</span>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl text-center">
                        <span class="block font-black text-gray-900 text-lg">VIP</span>
                        <span class="text-[10px] text-gray-400">會員等級</span>
                    </div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto py-2">
                <div onclick="openPersonalCenter()" class="flex items-center gap-4 p-4 active:bg-gray-50 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600"><i class="fa-solid fa-user-gear"></i></div>
                    <span class="font-medium">個人中心</span>
                </div>
                <div onclick="openFansSubsModal()" class="flex items-center gap-4 p-4 active:bg-gray-50 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600"><i class="fa-solid fa-users"></i></div>
                    <span class="font-medium">粉絲與訂閱</span>
                </div>
                <div onclick="openNotifications()" class="flex items-center gap-4 p-4 active:bg-gray-50 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600"><i class="fa-solid fa-bell"></i></div>
                    <span class="font-medium">通知中心</span>
                    <span class="ml-auto w-5 h-5 bg-sexify text-white text-[10px] flex items-center justify-center rounded-full">3</span>
                </div>
                <div class="flex items-center gap-4 p-4 active:bg-gray-50 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600"><i class="fa-solid fa-shield-halved"></i></div>
                    <span class="font-medium">隱私與安全</span>
                </div>
                <div class="flex items-center gap-4 p-4 active:bg-gray-50 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600"><i class="fa-solid fa-language"></i></div>
                    <span class="font-medium">語言設定 (Language)</span>
                </div>
            </div>
            <div class="p-4 border-t border-gray-50">
                <div id="logout-btn" class="flex items-center gap-4 p-4 text-red-500 active:bg-gray-100 transition cursor-pointer">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-red-50">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <span class="font-medium">登出帳號</span>
                </div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-[500] bg-white flex items-center justify-center p-6 hidden">
        <div class="max-w-sm w-full text-center">
            <h1 id="auth-title" class="text-4xl font-black text-sexify tracking-tighter mb-2">SEXIFY</h1>
            <p id="auth-subtitle" class="text-gray-500 mb-8">登入以繼續探索</p>
            <div class="space-y-4 mb-8">
                <div id="auth-name-field" class="hidden">
                    <input type="text" id="auth-name" placeholder="顯示名稱" class="w-full bg-gray-50 border-0 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-sexify/20 transition text-sm">
                </div>
                <input type="email" id="auth-email" placeholder="電子郵件" class="w-full bg-gray-50 border-0 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-sexify/20 transition text-sm">
                <input type="password" id="auth-password" placeholder="密碼" class="w-full bg-gray-50 border-0 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-sexify/20 transition text-sm">
            </div>
            <button id="auth-btn" onclick="handleAuthAction()" class="w-full bg-sexify text-white font-bold py-4 rounded-2xl shadow-lg shadow-sexify/20 active:scale-95 transition mb-6">登入</button>
            <p class="text-sm text-gray-500">
                <span id="auth-switch-text">還沒有帳號嗎？</span>
                <button id="auth-switch-btn" onclick="toggleAuthMode()" class="text-sexify font-bold underline ml-1">立即註冊</button>
            </p>
        </div>
    </div>

    <div id="chat-detail" class="fixed inset-0 z-[200] bg-white hidden flex flex-col">
        <div class="h-16 border-b flex items-center px-4 gap-4 flex-shrink-0">
            <button onclick="closeChat()" class="w-10 h-10 flex items-center justify-center text-xl text-gray-600"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-200 overflow-hidden"><img id="chat-target-avatar" src="" class="w-full h-full object-cover"></div>
                <div>
                    <div class="font-bold text-sm" id="chat-target-name"></div>
                    <div class="text-[10px] text-green-500 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> 在線中</div>
                </div>
            </div>
            <button class="ml-auto w-10 h-10 flex items-center justify-center text-xl text-gray-400"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-6 bg-gray-50"></div>
        <div class="p-4 border-t bg-white flex items-center gap-3 pb-8 flex-shrink-0">
            <button onclick="document.getElementById('chat-image-input').click()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-sexify active:scale-90 transition text-lg flex-shrink-0"><i class="fa-solid fa-image"></i></button>
            <input type="file" id="chat-image-input" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleImageSelection(this)">
            <input type="text" id="chat-input" placeholder="發送訊息..." class="flex-1 bg-gray-100 rounded-full px-5 py-3 outline-none text-sm focus:ring-2 focus:ring-sexify/20 transition">
            <button onclick="handleSendAction()" class="bg-sexify text-white font-bold px-5 py-2.5 rounded-full shadow-md active:scale-95 transition flex-shrink-0">發送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/discovery.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
