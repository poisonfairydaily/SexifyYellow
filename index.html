<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexify - Social & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 隱藏捲軸但保留功能 */
        #chat-messages::-webkit-scrollbar, .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { color: #ff2d55 !important; }
        .bg-sexify { background-color: #ff2d55; }
        .text-sexify { color: #ff2d55; }
        
        /* 動態牆圖片比例 */
        .post-image-container { position: relative; padding-bottom: 125%; overflow: hidden; background: #f3f4f6; }
        .post-image-container img { position: absolute; width: 100%; hieght: 100%; object-fit: cover; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden bg-gray-50">

    <div id="age-gate" class="fixed inset-0 z-[3000] bg-black flex items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-10 rounded-[2.5rem] w-11/12 max-w-sm text-center shadow-2xl">
            <h2 class="text-4xl font-black text-sexify mb-3">SEXIFY</h2>
            <p class="text-gray-400 text-sm mb-8">此空間包含成人內容<br><span>進入即代表您已滿 18 歲</span></p>
            <button onclick="verifyAge()" class="w-full bg-sexify text-white font-bold py-4 rounded-full shadow-lg active:scale-95 transition-transform mb-4">我已滿 18 歲</button>
            <button onclick="location.href='https://www.google.com'" class="text-gray-400 text-xs font-medium">離開</button>
        </div>
    </div>

    <header class="fixed top-0 left-0 right-0 z-[1000] bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex justify-between items-center">
        <h1 class="text-2xl font-black tracking-tighter text-sexify">SEXIFY</h1>
        <div class="flex items-center gap-4">
            <button class="text-gray-400 hover:text-gray-600 transition relative">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1 -right-1 w-2 h-2 bg-sexify rounded-full"></span>
            </button>
            <div onclick="toggleProfileMenu()" class="w-8 h-8 rounded-full bg-gray-200 border-2 border-white shadow-sm cursor-pointer overflow-hidden">
                <img src="https://i.pravatar.cc/100?u=me" alt="avatar" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main class="pt-16 pb-24 min-h-screen">
        
        <section id="tab-home" class="tab-content animate-fade-in">
            <div id="post-feed" class="max-w-md mx-auto space-y-4 p-2">
                <div class="flex flex-col items-center justify-center py-20 text-gray-400">
                    <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
                    <p class="text-xs">正在加載精彩內容...</p>
                </div>
            </div>
        </section>

        <section id="tab-messages" class="tab-content hidden animate-fade-in">
            <div class="max-w-md mx-auto">
                <div class="px-4 py-2 flex justify-between items-center">
                    <h2 class="font-black text-xl">我的訊息</h2>
                    <button class="text-sexify text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i>新聊天</button>
                </div>
                <div id="messages-list" class="divide-y divide-gray-50">
                    </div>
            </div>
        </section>

        <section id="tab-explore" class="tab-content hidden p-10 text-center text-gray-400">探索內容開發中...</section>
        <section id="tab-shop" class="tab-content hidden p-10 text-center text-gray-400">商店功能開發中...</section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-[1000] bg-white/90 backdrop-blur-lg border-t border-gray-100 px-6 py-3 flex justify-between items-center pb-8">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 tab-active transition-all">
            <i class="fa-solid fa-house-chimney text-xl"></i>
            <span class="text-[10px] font-bold">首頁</span>
        </button>
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center gap-1 text-gray-300 transition-all">
            <i class="fa-solid fa-compass text-xl"></i>
            <span class="text-[10px] font-bold">探索</span>
        </button>
        <div class="relative -mt-8">
            <button class="w-14 h-14 bg-sexify text-white rounded-2xl rotate-45 shadow-lg shadow-pink-200 flex items-center justify-center active:scale-90 transition-transform">
                <i class="fa-solid fa-plus -rotate-45 text-xl"></i>
            </button>
        </div>
        <button onclick="switchTab('messages')" id="nav-messages" class="flex flex-col items-center gap-1 text-gray-300 transition-all">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[10px] font-bold">訊息</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-300 transition-all">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="text-[10px] font-bold">個人</span>
        </button>
    </nav>

    <div id="chat-modal" class="fixed inset-0 z-[2000] bg-white translate-x-full transition-transform duration-300 hidden flex flex-col">
        <div class="p-4 border-b flex items-center gap-3 bg-white sticky top-0 z-10 shadow-sm">
            <button onclick="closeChat()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full active:scale-90 transition">
                <i class="fa-solid fa-chevron-left text-gray-600"></i>
            </button>
            <div class="flex items-center gap-3 flex-1">
                <img id="chat-avatar" src="" class="w-9 h-9 rounded-full object-cover border border-gray-100">
                <div>
                    <h3 id="chat-name" class="font-black text-sm text-gray-800 leading-none">載入中...</h3>
                    <span class="text-[10px] text-green-500 font-bold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> 在線上
                    </span>
                </div>
            </div>
            <button class="text-gray-400 px-2"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col-reverse gap-3 bg-gray-50/50 hide-scrollbar relative">
            </div>

        <div id="chat-image-preview-container" class="hidden px-4 py-2 bg-gray-50 border-t flex-col">
            <div class="relative w-20 h-20 rounded-lg overflow-hidden border-2 border-sexify shadow-sm">
                <img id="chat-image-preview" src="" class="w-full h-full object-cover">
                <button onclick="cancelImageSelection()" class="absolute top-0 right-0 bg-black/50 text-white w-5 h-5 flex items-center justify-center text-[10px]"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-upload-progress" class="hidden mt-2 items-center gap-2">
                <div class="flex-1 h-1 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-sexify w-1/3 animate-pulse"></div></div>
                <span class="text-[10px] text-gray-400">上傳中...</span>
            </div>
        </div>

        <div class="p-4 border-t bg-white flex items-center gap-3 pb-8">
            <button onclick="document.getElementById('chat-image-input').click()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-sexify active:scale-90 transition text-lg flex-shrink-0"><i class="fa-solid fa-image"></i></button>
            <input type="file" id="chat-image-input" accept="image/*" class="hidden" onchange="handleImageSelection(this)">
            <input type="text" id="chat-input" placeholder="發送訊息..." class="flex-1 bg-gray-100 rounded-full px-5 py-3 outline-none text-sm focus:ring-2 focus:ring-sexify/20 transition">
            <button onclick="handleSendAction()" class="bg-sexify text-white font-bold px-5 py-2.5 rounded-full shadow-md active:scale-95 transition flex-shrink-0">發送</button>
        </div>
    </div>

    <div id="fans-subs-modal" class="fixed inset-0 z-[2200] bg-white translate-x-full transition-transform duration-300 hidden flex flex-col">
        <div class="p-4 border-b flex items-center gap-3 bg-white sticky top-0 z-10 shadow-sm">
            <button onclick="closeFansSubsModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 class="font-black text-lg text-gray-800">粉絲與訂閱用戶</h3>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <div id="subs-list" class="space-y-2"></div>
            <div id="fans-list" class="space-y-2"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-logic.js"></script> <script src="js/posts.js"></script>    <script src="js/fans.js"></script>     <script src="js/messages.js"></script> <script>
        // 額外的分頁切換邏輯 (如果 ui-logic.js 沒寫到的話)
        function switchTab(tabName) {
            // 隱藏所有分頁內容
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // 取消所有導航按鈕激活狀態
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('tab-active', 'text-sexify'));
            document.querySelectorAll('nav button').forEach(el => el.classList.add('text-gray-300'));

            // 顯示選擇的分頁
            const target = document.getElementById('tab-' + tabName);
            if(target) target.classList.remove('hidden');

            // 激活對應按鈕
            const navBtn = document.getElementById('nav-' + tabName);
            if(navBtn) {
                navBtn.classList.add('tab-active', 'text-sexify');
                navBtn.classList.remove('text-gray-300');
            }
            
            // 如果切換到個人，可在此處調用開啟 Profile 頁面的邏輯
            if(tabName === 'profile') {
                // 這裡可以呼叫 index (1) 裡面的 openProfileModal()
            }
        }

        // 年齡驗證邏輯
        function verifyAge() {
            const gate = document.getElementById('age-gate');
            gate.style.opacity = '0';
            setTimeout(() => gate.style.display = 'none', 500);
            localStorage.setItem('ageVerified', 'true');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('ageVerified') === 'true') {
                document.getElementById('age-gate').style.display = 'none';
            }
            // 預設進入首頁
            switchTab('home');
        });
    </script>
</body>
</html>
