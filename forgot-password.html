<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼 - 商城系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl w-full max-w-sm border border-gray-100">
        <h2 class="text-2xl font-black text-gray-900 mb-2">重設密碼</h2>
        <p class="text-gray-400 text-xs mb-8">請輸入您的 Email，我們將發送重設連結給您。</p>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase tracking-widest">Email Address</label>
                <input type="email" id="reset-email" placeholder="example@mail.com" 
                    class="w-full p-4 bg-gray-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-black transition-all">
            </div>

            <button onclick="handleResetRequest()" id="reset-btn" 
                class="w-full bg-black text-white p-4 rounded-2xl font-bold text-sm hover:opacity-90 transition-all active:scale-95">
                發送重設郵件
            </button>

            <p id="message" class="text-center text-[11px] font-medium min-h-[1rem]"></p>
            
            <div class="text-center mt-6">
                <a href="index.html" class="text-gray-400 text-xs hover:text-black">返回登入</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://shsmvbeebuxscnvnmlzf.supabase.co';
        const SUPABASE_ANON_KEY = '你的_ANON_KEY'; // 建議引用你現有的安全配置
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleResetRequest() {
            const email = document.getElementById('reset-email').value.trim();
            const btn = document.getElementById('reset-btn');
            const msgLabel = document.getElementById('message');

            if (!email) {
                msgLabel.style.color = "#ff4d4f";
                msgLabel.textContent = "❌ 請輸入 Email";
                return;
            }

            btn.disabled = true;
            btn.innerText = "發送中...";
            msgLabel.textContent = "";

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    // ✨ 重要：重設完後要跳轉回來的頁面網址，請確保在 Supabase 後台有設定此 Redirect URL
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                msgLabel.style.color = "#52c41a";
                msgLabel.textContent = "✅ 郵件已發送！請檢查您的信箱。";
                btn.innerText = "郵件已發送";

            } catch (err) {
                msgLabel.style.color = "#ff4d4f";
                msgLabel.textContent = "❌ " + err.message;
                btn.disabled = false;
                btn.innerText = "發送重設郵件";
            }
        }
    </script>
</body>
</html>
