<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創作者中心 - 投稿作品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .preview-grid::-webkit-scrollbar { display: none; }
        .upload-card { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.9); }
        .sexify-gradient { background: linear-gradient(135deg, #ff2442 0%, #ff5263 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="upload-card w-full max-w-lg rounded-[2.5rem] shadow-2xl p-8 border border-white">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">發布作品</h1>
            <p class="text-gray-400 text-sm mt-1">分享你的創作，讓世界看見</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1 ml-4">標題</label>
                <input type="text" id="p-name" class="w-full bg-gray-100 border-none rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="輸入作品名稱...">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1 ml-4">設定價格 (🪙)</label>
                <input type="number" id="p-price" class="w-full bg-gray-100 border-none rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-red-500 outline-none transition-all" placeholder="例如：100">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 ml-4">上傳相片 (多選)</label>
                <div class="relative group">
                    <input type="file" id="p-image" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="border-2 border-dashed border-gray-200 rounded-[2rem] p-10 flex flex-col items-center justify-center group-hover:border-red-400 transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-300 group-hover:text-red-400 mb-3"></i>
                        <span class="text-gray-400 text-xs">點擊或拖拽照片至此</span>
                    </div>
                </div>
            </div>

            <div id="preview-container" class="grid grid-cols-3 gap-2 mt-4 max-h-48 overflow-y-auto preview-grid">
                </div>
        </div>

        <div id="status-box" class="mt-6 hidden">
            <div class="flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-notch fa-spin text-red-500"></i>
                <span id="status-text" class="text-xs text-gray-500 font-medium">AI 正在審核中...</span>
            </div>
        </div>

        <button id="upload-btn" class="sexify-gradient w-full text-white font-bold py-4 rounded-2xl mt-8 shadow-lg shadow-red-200 active:scale-95 transition-transform">
            立即投稿
        </button>
    </div>

    <script src="js/creator.js"></script>
</body>
</html>
