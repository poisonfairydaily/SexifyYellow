<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;">
    
    <title>管理員審核中控台</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            color: #1d1d1f;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f2f2f2;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }
        th {
            text-align: left;
            background: #fff;
            padding: 12px 15px;
            color: #86868b;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid #f2f2f2;
        }
        td {
            padding: 20px 15px;
            vertical-align: middle;
            border-bottom: 1px solid #f9f9f9;
        }
        
        /* 讓表格在手機上能滾動 */
        .table-wrapper {
            overflow-x: auto;
        }

        .btn-back {
            text-decoration: none;
            color: #0066cc;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            background: #f5f5f7;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .btn-back:hover { background: #e8e8ed; }

        /* 修復圖片預覽樣式 */
        .audit-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #f5f5f7;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛠️ 商戶審核中控台</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="admin.html" class="btn-back">⬅️ 返回上傳頁面</a>
        </div>
    </header>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>圖片預覽</th>
                    <th>商品資訊</th>
                    <th>價格</th>
                    <th>AI 審核報告</th>
                    <th>操作決策</th>
                </tr>
            </thead>
            <tbody id="audit-list">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 60px; color: #86868b; font-size: 14px;">
                        <i class="fa-solid fa-spinner fa-spin" style="margin-bottom: 10px; font-size: 20px;"></i><br>
                        🚀 正在抓取商品數據與檢舉統計...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/dashboard.js"></script>

</body>
</html>
